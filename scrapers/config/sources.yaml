# Bid sources, one entry per upstream request.
#
# Each of these endpoints returns EVERY delivery point for that co-op in a
# single response, so the whole file costs one HTTP request per source.
#
# `tenant` is the AgriCharts subdomain. To find it for a new co-op, open its
# cash-bids page and read the `src` of the cashbids widget script - it looks
# like //<tenant>.agricharts.com/inc/cashbids/cashbids.php?...
# An unknown subdomain returns a 1,880-byte "Site Not Configured" page.

sources:
  - id: heartland
    adapter: heartland
    label: Heartland Co-op
    # 78 pins - the largest single source. Plain server-rendered HTML.

  - id: agricharts:cvacoop
    adapter: agricharts
    tenant: cvacoop
    referer: https://www.cvacoop.com/
    label: Central Valley Ag
    # The public cvacoop.com site is bot-protected and returns an empty 202,
    # but this backend answers normally.

  - id: agricharts:goldeagle
    adapter: agricharts
    tenant: goldeagle
    referer: https://goldeaglecoop.com/
    label: Gold Eagle Co-op

  - id: agricharts:procooperative
    adapter: agricharts
    tenant: procooperative
    referer: https://procooperative.com/
    label: Pro Cooperative

  - id: agricharts:midiowa
    adapter: agricharts
    tenant: midiowa
    referer: https://www.midiowacoop.com/
    label: Mid Iowa Co-op

  - id: agricharts:nicoop
    adapter: agricharts
    tenant: nicoop
    referer: https://nicoop.com/
    label: North Iowa Co-op

  - id: newcoop
    adapter: newcoop
    label: NEW Cooperative
    # 71 pins. Own server-rendered pages (no longer AgriCharts). Behind bot
    # protection, so this is the one source fetched with TLS impersonation.

  - id: landus
    adapter: landus
    label: Landus Cooperative
    # 51 pins. Own JSON API, but per-location: 1 + 51 requests, the only source
    # without a bulk endpoint. A failing location is skipped, not fatal.

  - id: agricharts:cargillus
    adapter: agricharts
    tenant: cargillus
    label: Cargill
    # 28 pins, mostly Illinois and Missouri river terminals. Read the note below
    # before touching this one - it was disabled for a while, on a reading of
    # the robots.txt situation that turned out to be incomplete.
    #
    # Cargill's own site loads bids from d96y3rjfk5o7l.cloudfront.net, which
    # 301s to cargillus.websol.barchart.com. That host's robots.txt reads:
    #
    #     User-agent: *
    #     Disallow: /
    #
    # But the same tenant is served from cargillus.agricharts.com, and that
    # host's robots.txt - identical to the one every other AgriCharts tenant
    # here serves - reads:
    #
    #     User-agent: *
    #     Allow: /markets/stocks.php
    #     Disallow: /markets/
    #
    # We request /inc/cashbids/cashbids-js.php, which is not under /markets/,
    # so the host we actually talk to permits the request we actually make.
    # Both hosts are Barchart's; the vendor publishes two different policies,
    # and robots.txt is per-origin by definition. This is the same platform and
    # the same endpoint as the fourteen other AgriCharts sources in this file,
    # all of which pass the identical check in fetch.py.
    #
    # That reasoning is defensible but it does rest on the per-origin reading,
    # and the stricter sibling host is a real signal about intent. The call to
    # enable it was the farm's to make, and it was made deliberately rather
    # than by default. To back it out, comment this block out again - nothing
    # else depends on it, and the 28 pins fall back to their "View bid page"
    # link exactly as they did before.
    #
    # Identify yourself via BIDS_CONTACT, and do not raise the request rate:
    # one bulk request covers all 77 of their locations.

  # The three Bushel aggregator sources share one API host and one request
  # each. See the compliance note at the top of adapters/bushel.py - enabled
  # by the user's explicit decision (per-host robots reading, as with Cargill).
  - id: bushel:chs
    adapter: bushel
    slug: chs
    label: CHS
    referer: https://chsag.com/grain/cash-bids/
    # 7 pins, all Minnesota. The feed returns 185 CHS locations nationwide.

  - id: bushel:agp
    adapter: bushel
    slug: agp
    label: AGP
    referer: https://www.agp.com/bids/
    # 16 pins. agp.com/bids/ renders this same data through an iframe.

  - id: bushel:scoular
    adapter: bushel
    slug: scoular
    label: The Scoular Company
    # 4 pins. Their public site scoularview.com is Bushel-HOSTED and its
    # robots.txt ends "User-Agent: * / Disallow: /", so those pages are off
    # limits; this is the aggregator API, the same route as CHS and AGP.
    # Scoular labels commodities with trade codes (YC, YSB) rather than names -
    # see classify_grain, which matches them exactly so the wheat and sorghum
    # in the same feed are not swept in.

  - id: bushel:smithfield
    adapter: bushel
    slug: smithfield
    label: Smithfield
    referer: https://smithfieldgrain.com/
    # 4 pins; the feed returns 48 locations.

  # United Cooperative (WI) is NOT here: their aggregator slug returns a single
  # "Central Office" stub with no per-elevator bids.

  # Self-hosted AgriCharts: same software, the co-op's own domain rather than a
  # tenant subdomain. They serve /markets/cash.php and answer the same
  # /inc/cashbids/ endpoint, so only the base URL differs.
  - id: agricharts:hartog
    adapter: agricharts
    base: https://www.hartogelevator.com
    label: Hartog Elevator
    referer: https://www.hartogelevator.com/markets/cash.php

