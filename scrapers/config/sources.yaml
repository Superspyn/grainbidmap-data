# Bid sources, one entry per upstream request.
#
# Each of these endpoints returns EVERY delivery point for that co-op in a
# single response, so the whole file costs one HTTP request per source.
#
# `tenant` is the AgriCharts subdomain. To find it for a new co-op, open its
# cash-bids page and read the `src` of the cashbids widget script - it looks
# like //<tenant>.agricharts.com/inc/cashbids/cashbids.php?...
# An unknown subdomain returns a 1,880-byte "Site Not Configured" page.

sources:
  - id: heartland
    adapter: heartland
    label: Heartland Co-op
    # 78 pins - the largest single source. Plain server-rendered HTML.

  - id: agricharts:cvacoop
    adapter: agricharts
    tenant: cvacoop
    referer: https://www.cvacoop.com/
    label: Central Valley Ag
    # The public cvacoop.com site is bot-protected and returns an empty 202,
    # but this backend answers normally.

  - id: agricharts:goldeagle
    adapter: agricharts
    tenant: goldeagle
    referer: https://goldeaglecoop.com/
    label: Gold Eagle Co-op

  - id: agricharts:procooperative
    adapter: agricharts
    tenant: procooperative
    referer: https://procooperative.com/
    label: Pro Cooperative

  - id: agricharts:midiowa
    adapter: agricharts
    tenant: midiowa
    referer: https://www.midiowacoop.com/
    label: Mid Iowa Co-op

  - id: agricharts:nicoop
    adapter: agricharts
    tenant: nicoop
    referer: https://nicoop.com/
    label: North Iowa Co-op

  - id: newcoop
    adapter: newcoop
    label: NEW Cooperative
    # 71 pins. Own server-rendered pages (no longer AgriCharts). Behind bot
    # protection, so this is the one source fetched with TLS impersonation.

  - id: landus
    adapter: landus
    label: Landus Cooperative
    # 51 pins. Own JSON API, but per-location: 1 + 51 requests, the only source
    # without a bulk endpoint. A failing location is skipped, not fatal.

  - id: agricharts:cargillus
    adapter: agricharts
    tenant: cargillus
    label: Cargill
    # 28 pins, mostly Illinois and Missouri river terminals. Read the note below
    # before touching this one - it was disabled for a while, on a reading of
    # the robots.txt situation that turned out to be incomplete.
    #
    # Cargill's own site loads bids from d96y3rjfk5o7l.cloudfront.net, which
    # 301s to cargillus.websol.barchart.com. That host's robots.txt reads:
    #
    #     User-agent: *
    #     Disallow: /
    #
    # But the same tenant is served from cargillus.agricharts.com, and that
    # host's robots.txt - identical to the one every other AgriCharts tenant
    # here serves - reads:
    #
    #     User-agent: *
    #     Allow: /markets/stocks.php
    #     Disallow: /markets/
    #
    # We request /inc/cashbids/cashbids-js.php, which is not under /markets/,
    # so the host we actually talk to permits the request we actually make.
    # Both hosts are Barchart's; the vendor publishes two different policies,
    # and robots.txt is per-origin by definition. This is the same platform and
    # the same endpoint as the fourteen other AgriCharts sources in this file,
    # all of which pass the identical check in fetch.py.
    #
    # That reasoning is defensible but it does rest on the per-origin reading,
    # and the stricter sibling host is a real signal about intent. The call to
    # enable it was the farm's to make, and it was made deliberately rather
    # than by default. To back it out, comment this block out again - nothing
    # else depends on it, and the 28 pins fall back to their "View bid page"
    # link exactly as they did before.
    #
    # Identify yourself via BIDS_CONTACT, and do not raise the request rate:
    # one bulk request covers all 77 of their locations.

  - id: nexus
    adapter: nexus
    label: Nexus Cooperative
    # 18 pins. One server-rendered page holds all 36 of their locations.
    # robots.txt allows /cash-bids/ and asks for a 3s crawl delay; one request
    # a run satisfies both. Note they also quote delivered bids to AGP, Cargill,
    # Valero and POET plants - those are Nexus's bids, not the plants' own, and
    # company scoping in match_locations.py keeps them off those pins.

  - id: cihedging:goldengrain
    adapter: cihedging
    company_id: 98951
    label: Golden Grain Energy
    referer: https://ggecorn.com/
    # 1 pin (Mason City). CI Hedging widget - the company id comes from the
    # "companyID:" line in the tableOptions block on the embedding page.

  - id: gradable:poet
    adapter: gradable
    tenant: poet
    label: POET Biorefining
    # 13 POET pins + 5 Flint Hills/POET. robots.txt: User-agent: * / Allow: /

  - id: gradable:adm
    adapter: gradable
    tenant: adm
    label: ADM (Gradable)

  - id: agricharts:keycoop
    adapter: agricharts
    tenant: keycoop
    referer: https://www.keycoop.com/
    label: Key Cooperative

  - id: agricharts:cgb
    adapter: agricharts
    tenant: cgb
    referer: https://cgb.com/
    label: CGB

  - id: agricharts:innovativeag
    adapter: agricharts
    tenant: innovativeag
    referer: https://www.innovativeag.com/
    label: Innovative Ag Services

  - id: agricharts:coopfe
    adapter: agricharts
    tenant: coopfe
    referer: https://www.coopfe.com/
    label: CFE

  - id: agricharts:statelinecoop
    adapter: agricharts
    tenant: statelinecoop
    referer: https://statelinecoop.com/
    label: Stateline Cooperative

  - id: agricharts:tamabentoncoop
    adapter: agricharts
    tenant: tamabentoncoop
    referer: https://www.tamabentoncoop.com/
    label: Tama-Benton Cooperative

  - id: agricharts:tworivers
    adapter: agricharts
    tenant: tworivers
    referer: https://tworivers.coop/
    label: Two Rivers Cooperative
    # tworivers.coop itself returns 403 to plain HTTP, but this backend answers.

  - id: agricharts:silveredgecoop
    adapter: agricharts
    tenant: silveredgecoop
    referer: https://www.silveredgecoop.com/
    label: SilverEdge Cooperative

  - id: agricharts:jbslivepork
    adapter: agricharts
    tenant: jbslivepork
    referer: https://www.jbslivepork.com/
    label: JBS Live Pork

# --- Not yet implemented (Phase 3) ------------------------------------------
# newcoop  - 71 pins. Server-rendered HTML, 76 per-location tables with
#            COMMODITY/DELIVERY/CASH PRICE/BASIS/FUTURE PRICE/FUTURE CHANGE.
#            Futures are tick format ("534-2"), basis is in cents ("-44").
#            Blocked by a 403 bot wall on plain HTTP; loads fine in a browser,
#            so it needs Playwright. No longer on AgriCharts.
# landus   - 51 pins. Client-rendered; returns 429 on cold requests.
# gradable - 14 pins (POET). Bids load client-side.
# bushel   - 5 pins (Valero). Client-side, and several URLs are login-gated;
#            those are deliberately out of scope.
