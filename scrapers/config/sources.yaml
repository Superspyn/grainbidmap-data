# newcoop  - 71 pins. Server-rendered HTML, 76 per-location tables with
#            COMMODITY/DELIVERY/CASH PRICE/BASIS/FUTURE PRICE/FUTURE CHANGE.
#            Futures are tick format ("534-2"), basis is in cents ("-44").
#            Blocked by a 403 bot wall on plain HTTP; loads fine in a browser,
#            so it needs Playwright. No longer on AgriCharts.
# landus   - 51 pins. Client-rendered; returns 429 on cold requests.
# gradable - 14 pins (POET). Bids load client-side.
