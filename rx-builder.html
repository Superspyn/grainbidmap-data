<div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#8b95a5;font-family:DM Sans,sans-serif">Loading...</div></div>
<script>
// ====== Field data (baked in by dev/jd_build_rx.py) ======

// Farm-field tree from boundaries
// Derived tables. FI = each field's sampling events with the field averages,
// FP = the grid points, both keyed by Deere field name (dev/jd_build_rx.py
// matched every lab grid to the boundary its points fall inside).
const FI={},FP={};
Object.entries(SOIL).forEach(([f,rec])=>{
  // Keep the provenance of a derived set: which grid it came from, which
  // composite set its level, and which nutrients were actually anchored.
  const keep=s=>({d:s.d,n:s.n,lab:s.lab,kind:s.kind||'grid',report:s.report,
                  from_grid:s.from_grid,from_whole:s.from_whole,
                  anchored:s.anchored,moves:s.moves});
  FI[f]={county:rec.county,sets:rec.sets.map(s=>Object.assign(keep(s),s.avg))};
  const withPts=rec.sets.filter(s=>s.pts&&s.pts.length).map(s=>Object.assign(keep(s),{pts:s.pts}));
  if(withPts.length)FP[f]={county:rec.county,sets:withPts};
});
// A whole-field composite is ONE lab result for the field, laid out over
// the boundary by dev/jd_build_rx.py so the rest of the page can treat it
// like any other sample set. The nutrient map of such a field is flat and
// means nothing spatially; only the rate map varies, through yield. Say so
// wherever a number could be mistaken for a grid measurement.
// Which sampling event a field is being read through. The newest test is
// the default everywhere; picking an older one is sticky per field, so the
// map, the rates and anything exported for that field all agree.
const setPick={};
function activeIdx(f){const fp=FP[f];if(!fp||!fp.sets.length)return -1;
  const last=fp.sets.length-1,v=setPick[f];
  return (v!=null&&v>=0&&v<=last)?v:last;}
function activeSet(f){const i=activeIdx(f);return i<0?null:FP[f].sets[i];}
// The same event in the averages table, matched on its date rather than
// its position: FI carries every event, FP only those with points.
function activeInfo(f){const fi=FI[f];if(!fi||!fi.sets.length)return null;
  const s=activeSet(f);
  if(s){const m=fi.sets.filter(x=>x.d===s.d&&(x.kind||'grid')===(s.kind||'grid'));
    if(m.length)return m[m.length-1];}
  return fi.sets[fi.sets.length-1];}
function isComposite(f){const s=activeSet(f);return !!s&&s.kind==='whole';}
function setLabel(s){
  if(s.kind==='whole')return `${s.d} · whole-field composite${s.n?', '+s.n+' samples':''}`;
  if(s.kind==='scaled')return `${s.d} level on the ${String(s.from_grid).slice(0,4)} grid · ${s.pts.length} points`;
  return `${s.d} · grid, ${s.pts.length} points`;}
function isScaled(f){const s=activeSet(f);return !!s&&s.kind==='scaled';}
const SCALED_NOTE=n=>`A 2026 whole-field test on an older grid's pattern. The ${n.from_grid.slice(0,4)} grid says where the good ground is; the ${n.d} composite says what the field tests now, so every point was moved by the same amount its field average moved. A derived reading, not a lab result.`;
function pickSet(f,v){setPick[f]=+v;clearOv();renderPts();
  // The sidebar badge and the map tooltips both read activeInfo(), so they
  // go stale unless they are redrawn too.
  uSB();rfM();rP();showInterp();}
const COMPOSITE_NOTE='Whole-field composite &mdash; one lab sample for the field, not a grid. The nutrient map is flat; rates still vary with yield history.';
const FF={},FPROP={},BNDRY={};
// USDA-NRCS soil survey (SSURGO) map units under each field, with the two
// productivity ratings, fetched by dev/jd_rx_ssurgo.py. CSR2 is Iowa's
// Corn Suitability Rating (5-100, Iowa map units only); NCCPI is the
// national index (0-100, every state), with corn and soybean sub-models.
const SV=(typeof SURVEY!=='undefined')?SURVEY:{fields:{},mapunits:{}};
let svCrop='all';   // which NCCPI: all, corn or soy
let prevNut='fert';  // the menu entry to go back to when leaving the VR zones
const SV_BREAKS=[40,55,70,85];
const SV_GRAY='#6b7280';
function isSurvey(n){return n==='csr'||n==='nccpi';}
function svLabel(n){return n==='csr'?'CSR2':'NCCPI'+(svCrop==='all'?'':' ('+(svCrop==='corn'?'corn':'soybean')+')');}
function svValue(mukey){const m=SV.mapunits[mukey];if(!m)return null;
  if(hNut==='csr')return m.csr2==null?null:m.csr2;
  const v=(m.nccpi||{})[svCrop];return v==null?null:v;}
function svClass(v){let k=0;while(k<SV_BREAKS.length&&v>=SV_BREAKS[k])k++;return k;}
function svColor(v){if(v==null)return SV_GRAY;const c=FERT_COLORS[svClass(v)];return `rgb(${c[0]},${c[1]},${c[2]})`;}
function svRange(i){return i===0?`under ${SV_BREAKS[0]}`:i>=SV_BREAKS.length?`${SV_BREAKS[i-1]} and up`:`${SV_BREAKS[i-1]} - ${SV_BREAKS[i]}`;}
function svPieces(f){const r=SV.fields[f];return r&&r.pieces?r.pieces:[];}
// The field's own number: acres-weighted over the map units that carry one.
function svSummary(f){
  const pcs=svPieces(f);let num=0,den=0,unrated=0,total=0;const cls=new Array(SV_BREAKS.length+1).fill(0);
  for(const pc of pcs){const v=svValue(pc.mukey);total+=pc.ac;if(v==null){unrated+=pc.ac;continue;}num+=v*pc.ac;den+=pc.ac;cls[svClass(v)]+=pc.ac;}
  return{avg:den?num/den:null,rated:den,unrated,total,cls,n:pcs.length};}
B.features.forEach(f=>{const p=f.properties,fm=p.org+' · '+p.farm;if(!FF[fm])FF[fm]=[];FF[fm].push(p.field);FPROP[p.field]=p;BNDRY[p.field]=f.geometry;});
Object.values(FF).forEach(a=>a.sort());
// Every exterior ring and every hole of a field, as closed [lon,lat] rings.
// 178 of the 447 fields are multi-part and 162 have farmstead or waterway
// cutouts, so "the ring" of a field is not a thing.
function fieldRings(f){const g=BNDRY[f];if(!g)return{ext:[],holes:[]};const polys=g.type==='MultiPolygon'?g.coordinates:[g.coordinates];
  return{ext:polys.map(p=>p[0]),holes:polys.flatMap(p=>p.slice(1))};}
function inField(x,y,fr){return fr.ext.some(r=>pip(x,y,r))&&!fr.holes.some(r=>pip(x,y,r));}
// Acres of one raster cell at this latitude (cells are sRES degrees square).
function cellAcres(raster){const lat=raster.ymin+raster.sny*raster.sRES/2;const m=raster.sRES*111320;return m*m*Math.cos(lat*Math.PI/180)/4046.8564;}
// Which raster cells lie inside the field (cached on the raster).
function fieldCells(raster,f){if(raster._in)return raster._in;const fr=fieldRings(f),a=new Uint8Array(raster.snx*raster.sny);
  for(let iy=0;iy<raster.sny;iy++){const py=raster.ymin+(iy+0.5)*raster.sRES;for(let ix=0;ix<raster.snx;ix++){if(inField(raster.xmin+(ix+0.5)*raster.sRES,py,fr))a[iy*raster.snx+ix]=1;}}
  raster._in=a;return a;}
// Zone acreage from the raster, not from "points x 2.5 acres".
// Per zone, from the raster the map paints: acres inside the field, the
// mean rate of its cells (what the export writes), and the lowest and
// highest cell rate in it. Zone 1 of a map with a no-application zone is
// exactly 0, whatever stray cells the tidying swept in.
function zoneStats(raster,f){
  const inF=fieldCells(raster,f),ac=cellAcres(raster),nz=raster.nz||NZONES;
  const out=[];for(let z=0;z<=nz;z++)out.push({ac:0,n:0,sum:0,lo:Infinity,hi:-Infinity,mean:0});
  for(let i=0;i<inF.length;i++){
    if(!inF[i]||!raster.mask[i])continue;
    const z=raster.zoneGrid[i],v=raster.grid[i],o=out[z];
    o.ac+=ac;o.n++;o.sum+=v;if(v>o.hi)o.hi=v;
    // The spread quoted for a zone leaves out zero cells the tidying
    // swept in from the no-application ground next door; they are in
    // the mean, where they belong, but "0-76" is not what the zone is.
    if(v<o.lo&&(v>0||!raster.zeroZone))o.lo=v;}
  out.forEach((o,z)=>{if(!o.n){o.lo=o.hi=0;return;}o.mean=Math.round(o.sum/o.n);if(o.lo===Infinity)o.lo=0;
    if(raster.bands&&raster.bands[z]){o.lo=raster.bands[z][0];o.hi=raster.bands[z][1];}
    if(raster.zeroZone&&z===1){o.mean=0;o.lo=0;o.hi=0;}});
  return out;}
function zoneAcres(raster,f){const inF=fieldCells(raster,f),ac=cellAcres(raster),out=new Array((raster.nz||NZONES)+1).fill(0);
  for(let i=0;i<inF.length;i++){if(inF[i]&&raster.mask[i])out[raster.zoneGrid[i]]+=ac;}return out;}

// ISU PM 1688 (2023 update) soil-test interpretation categories
const TH={
  // P and K: the February 2023 revision of PM 1688 (Bray-1 P; ammonium
  // acetate K on dried samples), as reprinted in the Iowa NRCS 590 guide
  // of November 2023. The 2013 boundaries were 8/15/20/30 and 90/130/170/200.
  p:{vl:9,lo:17,op:25,hi:34,vh:60,u:'ppm',nm:'Phosphorus (P)',rx:'P₂O₅',
     cats:['Very Low (0-9)','Low (10-17)','Optimum (18-25)','High (26-34)','Very High (35+)']},
  k:{vl:125,lo:170,op:220,hi:270,vh:400,u:'ppm',nm:'Potassium (K)',rx:'K₂O',
     cats:['Very Low (0-125)','Low (126-170)','Optimum (171-220)','High (221-270)','Very High (271+)']},
  ph:{vl:5.0,lo:5.5,op:6.0,hi:7.5,vh:8.5,u:'',nm:'Soil pH',rx:'Lime',
     cats:['Very Low (<5.0)','Low (5.0-5.5)','Target (5.5-6.0)','Adequate (6.0-7.5)','High (>7.5)']},
  om:{vl:1.5,lo:2.5,op:3.5,hi:6.0,vh:10,u:'%',nm:'Organic Matter'},
  cec:{vl:8,lo:12,op:18,hi:30,vh:50,u:'meq/100g',nm:'CEC'},
  ca:{vl:500,lo:1500,op:3000,hi:5000,vh:10000,u:'ppm',nm:'Calcium'},

// ISU PM 1688 rate calculations — yield goal drives removal, target drives buildup

// ---- Yield, from Operations Center ----
// OPS has each field's seasons: what was planted, what came off (Deere's own
// average, acres and moisture per harvest pass) and what was applied.
// YMAPS has each harvest pass thinned to 20 m cells of yield INDEX: the cell
// against the field's own average, x100, 0 where the combine never went.

// steadier than any one year's yield map.

  for(const m of maps){const a=decodeIdx(m);const cx=Math.floor((x-m.lon0)/m.dlon),cy=Math.floor((y-m.lat0)/m.dlat);let s=0,c=0;

  const h=harvestHistory(f).filter(x=>x.crop===crop&&x.avg);if(!h.length)return null;

// corn at 210 bu removes 67 lb P2O5 and 46 lb K2O; soybean at 70 bu
// removes 50 and 84. The 2013 table this used to carry (0.375/0.30 corn,
// 0.80/1.50 soybean) was 17-36% higher.
function removalPerBu(nut,crop){return nut==='p'?(crop==='corn'?67/210:50/70):(crop==='corn'?46/210:84/70);}

// corn-soybean rotation given no fertilizer (117 lb P2O5 and 130 lb K2O

// about 21 lb P2O5 and 11 lb K2O per ppm. It says that varies two-fold
// between fields, so this is a farm-average figure.

// and leave the test at the level to hold (tgt):

//   above it   - the surplus over tgt is a bank of PER_PPM lb a ppm; the

// Build zone-aware rate function:
// userYG = the user's yield goal (always rxYG from the slider)
// Harvest data provides spatial yield variation: high-yielding zones get higher
// removal, low-yielding zones get lower removal, all centered around userYG.
// Crop selection determines removal coefficients (corn vs soybean).
// Prev crop (pc) affects available N credit (soybean credit = -45 lb N/ac).
const RATE_NEEDS={p:['p'],k:['k'],ph:['ph','bph'],s:['s'],zn:['zn'],n:['om']};

const RATE_MIN_BAND={p:5,k:5,ph:250,s:3,zn:1,n:10};
// How this spot compares with the field, 1 = the field average: from the

function ratingIndexAt(f,x,y){

  if(y1!=null&&r1!=null)return (y1+r1)/2;

    // Where no combine has been, the goal stands as is.
    function localEffYield(){
      const idx=spotIndex(fieldName,pt.x,pt.y);

// IDW interpolation - power=1.5 for smooth concentric contours per literature
// How many of the nearest samples a cell is interpolated from. Weighting
// by EVERY sample in the field, which is what this did before, drags every
// cell towards the field mean: a 658-acre field with 53 of its 272 samples
// at or below 30 ppm P came out as one flat colour, every acre "very high",
// because the far side of the field still had a vote. A local
// neighbourhood is what makes an interpolated map follow its samples.
// Four, at power 3. Tested against the lab's own acres-per-band on two
// fields whose samples are exactly the ones the lab mapped: 12 neighbours
// at power 1.5 was off by 21% of one field and 44% of the other; 4 at
// power 3 is off by 2% and 8%. The lab interpolates very locally.
const IDW_NEIGHBOURS=4;

// made in real distance or the east-west ones get picked too readily.
function idw(px,py,points,nut,power,cx){
  const pw=power||IDW_POWER,K=IDW_NEIGHBOURS,cl=cx||1;

// Number of discrete contour zones
const NZONES=5;

// Soil nutrient colors: red(very low) -> yellow -> green -> teal -> blue(very high)
const ZONE_COLORS_NUT=[
  [210,40,40],[230,175,30],[50,185,60],[30,155,135],[40,95,200]

// Rate colors: blue(low/no need) -> green -> yellow -> orange -> red(high need)
// Colours for however many zones a rate map has: blue only for a real
// "none needed" zone, the rest spread green to red.
function rateColors(raster){
  const all=ZONE_COLORS_RATE,rest=all.slice(1),nz=raster.nz||NZONES;

function genRaster(fieldName,nut,setIdx,isRate,rateFn,breaks){

    // or above target. Interpolating and blurring across that cliff invents
    // in-between rates that match no recommendation, and smears fertiliser
    // over the block of ground that asked for none. Interpolating the soil
    // test keeps the cliff where the soil puts it.
    const need=rateFn.needs||['p','k','ph','bph','s','zn','om'];

  // clipping step could only snap stray vertices to the nearest boundary
  // point, leaving the chords between them cutting across the neighbour's
  // ground - 26% of the polygon on one field. The mask now keeps a cell
  // only if the cell TOUCHES the field: its centre or any of its corners
  // inside an exterior ring. Holes are deliberately still covered (the
  // monitor's own boundary shuts the spreader off over a farmstead), so
  // this tests the exterior rings only.
  //
  // The value is sampled at the cell's CENTRE, because everything
  // downstream - fieldCells, zoneAcres, the vectorised outline - treats a

  // little fertiliser on the ground that asked for none, which is the
  // whole problem this pass was hiding. The mode filter and the
  // fragment sweep below still tidy the zone edges. The fertility score
  // is continuous, so it is blurred like a nutrient map.
  // Only the fertility score is blurred now. Tested against the lab's own
  // acres-per-band on a 658-acre field, every smoothing pass on a nutrient
  // map moved it further from the lab's picture, not closer.
  const scoreMap=!!(isRate&&rateFn&&(rateFn===fertScore||rateFn.continuous));

  // the surface is already smooth, and a second pass only rubs out small
  // patches that the samples really did find.
  for(let pass=0;smooth&&pass<1;pass++){
    const tmp=new Float32Array(grid);
    const R=2;
    for(let iy=R;iy<sny-R;iy++){
      for(let ix=R;ix<snx-R;ix++){
        const ci=iy*snx+ix;
        if(!mask[ci])continue;
        let sum=0,cnt=0;
        for(let dy=-R;dy<=R;dy++){for(let dx=-R;dx<=R;dx++){
          const ni=(iy+dy)*snx+(ix+dx);
          if(ni>=0&&ni<snx*sny&&mask[ni]){sum+=grid[ni];cnt++;}
        }}
        if(cnt>0)tmp[ci]=sum/cnt;
      }
    }
    grid.set(tmp);
  }

  // A rate surface where some ground needs nothing gets a dedicated
  // zone 1 for that ground.
  let zeroCells=0;
  if(isRate&&rateFn&&rateFn!==fertScore&&!breaks)
    for(let i=0;i<snx*sny;i++)if(mask[i]&&grid[i]<=0)zeroCells++;
  const zeroZone=zeroCells>0&&vmax>0;
  const range=vmax-vmin||1;
  // How many classes this raster carries: the lab's bands run to six.
  // A rate map gets as many bands as its spread has room for. Cutting a
  // field whose rates run 44 to 56 lb into five bands drew five colours
  // of noise two pounds apart; a band is at least minBand wide (5 lb of
  // P2O5 or K2O), so that field is one or two zones, which is what a
  // spreader can tell apart.
  let NZ=breaks?breaks.length+1:NZONES,bands=null;
  if(rateMap){
    const minBand=(rateFn&&rateFn.minBand)||0;
    if(zeroZone){
      const nPos=minBand?Math.max(1,Math.min(NZONES-1,Math.floor(vmax/minBand))):NZONES-1;
      NZ=1+nPos;bands=[null,[0,0]];
      for(let k=0;k<nPos;k++)bands.push([vmax*k/nPos,vmax*(k+1)/nPos]);
    }else{
      const n=minBand?Math.max(1,Math.min(NZONES,Math.floor(range/minBand))):NZONES;
      NZ=n;bands=[null];
      for(let k=0;k<n;k++)bands.push([vmin+range*k/n,vmin+range*(k+1)/n]);
    }
  }

  // 3. Classify into discrete zones. Given absolute breaks, use them: a
  // fertility map has to mean the same thing on every field, where a
  // nutrient map is read against the field's own spread.
  const zoneGrid=new Uint8Array(snx*sny);
  for(let i=0;i<snx*sny;i++){
    if(!mask[i])continue;
    if(breaks){
      let z=1;while(z<=breaks.length&&grid[i]>breaks[z-1])z++;
      zoneGrid[i]=Math.min(NZ,z);
    }else if(zeroZone){
      // "Apply nothing" is its own zone. Otherwise the bottom band spans
      // zero up to a fifth of the range, mixing ground that needs none
      // with ground that needs a little, and the zone goes out at the
      // average of the two - fertiliser on acres the soil test cleared.
      if(grid[i]<=0)zoneGrid[i]=1;
      else{
        const norm=grid[i]/(vmax||1);
        zoneGrid[i]=Math.min(NZ-2,Math.max(0,Math.floor(norm*(NZ-1))))+2;
      }
    }else{
      const norm=(grid[i]-vmin)/range;
      zoneGrid[i]=Math.min(NZ-1,Math.max(0,Math.floor(norm*NZ)))+1;
    }
  }

  // 4. Mode filter with 5x5 kernel — eliminates isolated small zones.
  //
  // Gentle on a rate map that has a no-application zone. Four passes of a
  // 5x5 majority vote over ground that is 90% "apply nothing" swallows the
  // spots that do need product, and then the zone average puts a little
  // product everywhere instead of the right amount in the right places.
  // One pass still removes single-cell speckle, and the flood-fill below
  // clears anything genuinely too small to spread.
  // One majority-vote pass tidies a rate map's zone edges; a nutrient map
  // is left exactly as the samples put it.
  const modePasses=rateMap?1:0;
  for(let pass=0;pass<modePasses;pass++){
    const tmp=new Uint8Array(zoneGrid);
    const R2=2;
    for(let iy=R2;iy<sny-R2;iy++){
      for(let ix=R2;ix<snx-R2;ix++){
        const ci=iy*snx+ix;
        if(!mask[ci])continue;
        const counts=new Uint8Array(NZ+1);
        for(let dy=-R2;dy<=R2;dy++){
          for(let dx=-R2;dx<=R2;dx++){
            const ni=(iy+dy)*snx+(ix+dx);
            if(ni>=0&&ni<snx*sny&&mask[ni])counts[zoneGrid[ni]]++;
          }
        }
        let best=zoneGrid[ci],bestC=0;
        for(let z=1;z<=NZ;z++){if(counts[z]>bestC){bestC=counts[z];best=z;}}
        tmp[ci]=best;
      }
    }
    zoneGrid.set(tmp);
  }

  // 5. Remove isolated fragments — flood-fill each connected region,
  // if area < threshold, absorb into most common neighboring zone
  const visited=new Uint8Array(snx*sny);
  // A 2.5-acre grid sample stands for about 2.5 acres, which is roughly
  // 4 cells at this resolution, so a 4-cell patch is a real reading rather
  // than speckle. Eight threw away ground the lab had actually measured.
  const minArea=rateMap?4:0;   // 0: keep every patch on a nutrient map
  for(let i=0;i<snx*sny;i++){
    if(!mask[i]||visited[i]||!zoneGrid[i])continue;
    // BFS flood fill
    const z=zoneGrid[i];
    const region=[i];
    const queue=[i];
    visited[i]=1;
    const neighborZones=new Uint8Array(NZ+1);
    while(queue.length){
      const ci=queue.shift();
      const cy=Math.floor(ci/snx),cx=ci%snx;
      for(let d=0;d<4;d++){
        const ny2=cy+[0,0,-1,1][d],nx2=cx+[-1,1,0,0][d];
        if(ny2<0||ny2>=sny||nx2<0||nx2>=snx)continue;
        const ni=ny2*snx+nx2;
        if(!mask[ni])continue;
        if(zoneGrid[ni]===z&&!visited[ni]){visited[ni]=1;region.push(ni);queue.push(ni);}
        else if(zoneGrid[ni]!==z&&zoneGrid[ni]>0){neighborZones[zoneGrid[ni]]++;}
      }
    }
    // If region is too small, absorb into most common neighbor
    if(region.length<minArea){
      let bestZ=z,bestN=0;
      for(let zz=1;zz<=NZ;zz++){if(neighborZones[zz]>bestN){bestN=neighborZones[zz];bestZ=zz;}}
      region.forEach(ci=>{zoneGrid[ci]=bestZ;});
    }
  }

  return{grid,zoneGrid,mask,snx,sny,xmin:gxmin,ymin:gymin,sRES,vmin,vmax,zeroZone,nz:NZ,bands};
}

function rasterToCanvas(raster,nut,isRate){
  if(!raster)return null;
  const scale=3;
  const w=raster.snx*scale,h=raster.sny*scale;
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');
  const colors=isRate?rateColors(raster):ZONE_COLORS_NUT;

  // Draw solid zone fills
  const imgData=ctx.createImageData(w,h);
  for(let iy=0;iy<h;iy++){
    const sy=raster.sny-1-Math.floor(iy/scale);
    for(let ix=0;ix<w;ix++){
      const sx=Math.floor(ix/scale);
      const si=sy*raster.snx+sx;
      const di=(iy*w+ix)*4;
      if(sy>=0&&sy<raster.sny&&sx>=0&&sx<raster.snx&&raster.mask[si]&&raster.zoneGrid[si]>0){
        const z=raster.zoneGrid[si]-1;
        const c=colors[z];
        imgData.data[di]=c[0];imgData.data[di+1]=c[1];imgData.data[di+2]=c[2];imgData.data[di+3]=215;
      }
    }
  }
  ctx.putImageData(imgData,0,0);

  // Draw contour lines between zones
  ctx.strokeStyle='rgba(0,0,0,0.3)';
  ctx.lineWidth=1;
  for(let iy=0;iy<raster.sny-1;iy++){
    for(let ix=0;ix<raster.snx-1;ix++){
      const ci=iy*raster.snx+ix;
      if(!raster.mask[ci])continue;
      const z=raster.zoneGrid[ci];
      const ri=iy*raster.snx+(ix+1);
      const di2=(iy+1)*raster.snx+ix;
      if(ix<raster.snx-1&&raster.mask[ri]&&raster.zoneGrid[ri]!==z){
        ctx.beginPath();ctx.moveTo((ix+1)*scale,(raster.sny-1-iy)*scale);ctx.lineTo((ix+1)*scale,(raster.sny-iy)*scale);ctx.stroke();
      }
      if(iy<raster.sny-1&&raster.mask[di2]&&raster.zoneGrid[di2]!==z){
        ctx.beginPath();ctx.moveTo(ix*scale,(raster.sny-1-iy)*scale);ctx.lineTo((ix+1)*scale,(raster.sny-1-iy)*scale);ctx.stroke();
      }
    }
  }
  return canvas;
}

    <div class="fc" style="padding:8px">${ym.map(m=>`<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid var(--bd)"><span style="color:var(--tx2)">${m.season} ${cropKey(m.crop)}${m.moisture!=null?` · ${m.moisture}%`:''}</span><span style="font-family:'JetBrains Mono',monospace;font-weight:600">${m.avg} bu/ac</span></div>`).join('')}</div>
    <div class="fc" style="padding:8px"><div class="lb" style="margin-bottom:3px">Share of the field</div>
      ${counts.map((c,i)=>c?`<div class="vr-zone"><div class="vr-color" style="background:rgb(${YIELD_COLORS[i].join(',')})"></div><span>${labels[i]}</span><span class="vr-rate">${Math.round(c/n*100)}%</span><span class="vr-acres">${(c/n*ac).toFixed(0)}ac</span></div>`:'').join('')}</div>`;
}
// ---------------------------------------------------------------- fertility
// One map for the whole soil test: every spot scored 0-100 on how well it
// feeds a crop, red where it feeds it worst and green where it feeds it
// best. Each nutrient is scored on its OWN ISU scale first, so a spot with
// 18 ppm P and 165 ppm K reads as two near-optimum numbers rather than as
// 18 against 165, and the score is the average of whichever nutrients are
// switched on and were actually tested there.
//
// Unlike the single-nutrient maps, the colours here are absolute. A field
// that tests well everywhere is green everywhere, instead of being stretched
// across the full palette and showing red on its own best ground.
const FERT_COLORS=[[203,45,45],[227,118,38],[226,192,46],[138,190,62],[42,163,74]];
const FERT_BREAKS=[40,55,70,85];          // 5 classes, 0-100
const FERT_NAMES=['Very poor','Poor','Fair','Good','Best'];
// What the builder can actually write a prescription for.
const FERT_NUTS=['p','k','ph','s','zn'];
const fertOn={p:true,k:true,ph:true,s:true,zn:true};

// How well one reading feeds the crop, 0 to 1, against that nutrient's own
// ISU categories. Above the "high" threshold a nutrient is not limiting, so
// it scores 1 and no higher: more phosphorus than the crop can use is not
// better ground.
function suff(nut,v){
  if(v==null)return null;
  const t=TH[nut];if(!t)return null;
  if(nut==='ph'){
    // Acidity costs yield quickly; alkalinity mostly ties up P, Zn and Mn.
    if(v>=6.2&&v<=7.2)return 1;
    if(v<6.2)return Math.max(0,(v-4.8)/(6.2-4.8));
    return Math.max(0.5,1-(v-7.2)/(8.6-7.2)*0.5);
  }
  const stops=[[0,0],[t.vl,0.25],[t.lo,0.5],[t.op,0.85],[t.hi,1]];
  if(v>=t.hi)return 1;
  for(let i=1;i<stops.length;i++){
    if(v<=stops[i][0]){
      const [x0,y0]=stops[i-1],[x1,y1]=stops[i];
      return x1===x0?y1:y0+(v-x0)/(x1-x0)*(y1-y0);
    }
  }
  return 1;
}

// The combined score at one sample point, or null where none of the chosen
// nutrients were tested.
fertScore.needs=FERT_NUTS;
function fertScore(pt){
  let sum=0,n=0;
  for(const k of FERT_NUTS){
    if(!fertOn[k])continue;
    const s=suff(k,pt[k]);
    if(s!=null){sum+=s;n++;}
  }
  return n?Math.round(sum/n*100):null;
}
function fertNutsOn(){return FERT_NUTS.filter(k=>fertOn[k]);}

// How far off: the soil rating against the soil test.
//
// The survey rating says what the ground itself can do; the fertility
// score says how well the soil test feeds a crop. Where good ground tests
// poor, the fertility is the thing holding the field back and fertilizer
// has the most to gain - that is the red end. Where the test is already
// as good as or better than the ground deserves, green: money spent
// there buys less.
//
// The rating is CSR2 and NCCPI together (their average) where the map
// unit has both, and whichever it has otherwise: Missouri map units carry
// no CSR2. The gap is rating minus fertility score, so positive means the
// fertility is behind the ground. The raster holds gap + 100 so the
// zoning code, which treats zero as "no rate", never sees a zero.
const GAP_BREAKS=[85,100,115,130];
const GAP_COLORS=[...FERT_COLORS].reverse();
const GAP_NAMES=['Ahead of the ground by 15+','Ahead by up to 15','Behind by up to 15','Behind by 15 - 30','Behind by 30+'];
const svLonLat={};
function svPiecesLonLat(f){
  if(!svLonLat[f])svLonLat[f]=svPieces(f).map(pc=>({mukey:pc.mukey,rings:pc.rings.map(r=>r.map(q=>[q[1],q[0]]))}));
  return svLonLat[f];}
function svRating(mukey){const m=SV.mapunits[mukey];if(!m)return null;
  const c=m.csr2,n=(m.nccpi||{}).all;
  if(c!=null&&n!=null)return (c+n)/2;
  return c!=null?c:n!=null?n:null;}
function svRatingAt(f,x,y){
  const pcs=svPiecesLonLat(f);
  for(const pc of pcs){
    if(pip(x,y,pc.rings[0])&&!pc.rings.slice(1).some(h=>pip(x,y,h)))return svRating(pc.mukey);}
  // In no polygon: the seam between two, or just outside the survey's own
  // edge of the field. Nearest polygon edge wins, within about 30 m.
  let best=null,bd=(0.0003)**2;
  for(const pc of pcs){
    for(const ring of pc.rings){
      for(let i=0;i<ring.length-1;i++){
        const d=segDist2(x,y,ring[i][0],ring[i][1],ring[i+1][0],ring[i+1][1]);
        if(d<bd){bd=d;best=pc;}}}}
  return best?svRating(best.mukey):null;}
// Squared distance from a point to a segment, in degrees.
function segDist2(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
  let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0;t=Math.max(0,Math.min(1,t));
  const cx=ax+t*dx,cy=ay+t*dy;return (px-cx)**2+(py-cy)**2;}
// The field's rating by acres, on the same blend.
function svRatingAvg(f){let num=0,den=0;for(const pc of svPieces(f)){const v=svRating(pc.mukey);if(v==null)continue;num+=v*pc.ac;den+=pc.ac;}return den?num/den:null;}
const gapFns={};
function makeGapFn(f){
  if(gapFns[f])return gapFns[f];
  const fn=(pt,x,y)=>{
    const fs=fertScore(pt);if(fs==null)return null;
    const r=svRatingAt(f,x!=null?x:pt.x,y!=null?y:pt.y);if(r==null)return null;
    return 100+r-fs;};
  fn.needs=FERT_NUTS;fn.continuous=true;
  return gapFns[f]=fn;}
// Which nutrient is holding a spot back, for the panel.
function fertLimiting(pt){
  let worst=null,wv=2;
  for(const k of fertNutsOn()){
    const s=suff(k,pt[k]);
    if(s!=null&&s<wv){wv=s;worst=k;}
  }
  return worst;
}
// The toggle row lives outside the panel, so it has to repaint itself:
// redrawing the map layers does not touch the controls.
function rFertChips(){
  const box=document.getElementById('fchips');if(!box)return;
  if(hNut!=='fert'&&hNut!=='gap'){box.style.display='none';box.innerHTML='';return;}
  box.style.display='';
  box.innerHTML=FERT_NUTS.map(k=>`<button class="preset-btn ${fertOn[k]?'act':''}" style="margin-right:3px" title="${fertOn[k]?'Counting':'Ignoring'} ${TH[k]?.nm||k}" onclick="toggleFert('${k}')">${TH[k]?.rx||TH[k]?.nm||k}</button>`).join('');
}
function toggleFert(k){
  if(fertOn[k]&&fertNutsOn().length===1)return;   // never leave it empty
  fertOn[k]=!fertOn[k];
  rFertChips();rfM();updateLegend();
  if(sel){rP();showInterp();}
}

// The fertility panel: how the field splits, and what is limiting it.
function rFert(){
  const set=activeSet(sel);if(!set)return'<div class="dn">No soil data.</div>';

  if(!scored.length)return `<div class="dn">This soil test did not report ${on.map(k=>TH[k]?.nm||k).join(', ')}.</div>`;
  const raster=genRaster(sel,null,null,true,fertScore,FERT_BREAKS);

  const ac=(FPROP[sel]||{}).acres||0;
  const vals=scored.map(x=>x.s);

  const lim={};scored.forEach(x=>{if(x.lim)lim[x.lim]=(lim[x.lim]||0)+1;});
  const limSorted=Object.entries(lim).sort((a,b)=>b[1]-a[1]);
  const perNut=on.map(k=>{

  return `<h2><div class="ic">\u{1F9ED}</div>Overall fertility</h2>

    <div class="fc" style="padding:8px">
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <div style="flex:1"><div class="lb">Field score</div><div class="vl" style="color:rgb(${FERT_COLORS[Math.min(4,FERT_BREAKS.filter(b=>avg>b).length)].join(',')})">${avg}</div></div>
        <div style="flex:1"><div class="lb">Range</div><div class="vl">${Math.min(...vals)}&ndash;${Math.max(...vals)}</div></div>
        <div style="flex:1"><div class="lb">Holding it back</div><div class="vl">${limSorted.length?(TH[limSorted[0][0]]?.rx||TH[limSorted[0][0]]?.nm||limSorted[0][0]):'—'}</div></div>
      </div>
      <div class="lb" style="margin-bottom:3px">Share of the field</div>
      ${FERT_NAMES.map((nm,i)=>{const a=zac?zac[i+1]:0;if(a<0.5)return'';
        return `<div class="vr-zone"><div class="vr-color" style="background:rgb(${FERT_COLORS[i].join(',')})"></div>
          <span class="vr-range">${nm}</span><span class="vr-rate">${ac?Math.round(a/ac*100):0}%</span>
          <span class="vr-acres">${a.toFixed(0)}ac</span></div>`;}).join('')}
    </div>
    <div class="fc" style="padding:8px;margin-top:8px">
      <div class="lb" style="margin-bottom:4px">By nutrient, weakest first</div>
      ${perNut.map(x=>`<div style="margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;font-size:11px">
          <span style="color:var(--tx2)">${TH[x.k]?.nm||x.k}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-weight:600">${x.pct}</span></div>
        <div style="height:6px;background:var(--bg);border-radius:3px;margin-top:3px;overflow:hidden">
          <div style="height:100%;width:${x.pct}%;background:rgb(${FERT_COLORS[Math.min(4,FERT_BREAKS.filter(b=>x.pct>b).length)].join(',')})"></div></div>
      </div>`).join('')}
      <div class="dn" style="margin-top:2px">${limSorted.length>1?`Most limiting at a spot: ${limSorted.slice(0,3).map(([k,n])=>`${TH[k]?.nm||k} on ${Math.round(n/scored.length*100)}%`).join(', ')}.`:''}</div>
    </div>`;
}

// One lab number for the field: show it against the ISU categories and be
// explicit that there is nothing to interpolate.
function rComposite(){
  const lt=activeInfo(sel);
  const t=TH[hNut]||{},v=lt[hNut];
  const ac=(FPROP[sel]||{}).acres;
  if(v==null)return `<h2><div class="ic">🧪</div>Whole-field composite</h2>
    <div class="dn">${COMPOSITE_NOTE}</div>

  const st=gSt(hNut,v);
  return `<h2><div class="ic">🧪</div>${t.nm||hNut} &mdash; whole-field composite</h2>
    <div class="dn">${COMPOSITE_NOTE}</div>
    <div class="fc" style="padding:8px">
      <div style="display:flex;gap:8px">

        <div style="flex:1"><div class="lb">ISU category</div><div class="vl">${gSL(st)}</div></div>
        <div style="flex:1"><div class="lb">Sampled</div><div class="vl">${lt.d}</div></div>

      </div>

    </div>`;
}
// The soil-survey panel: the field's rating, its acres by class, and the
// map units it is made of.
function rSurvey(){
  const pcs=svPieces(sel);
  if(!pcs.length)return'<div class="dn">No soil survey coverage fetched for this field yet (dev/jd_rx_ssurgo.py).</div>';

  const none=isCSR&&sm.rated===0;
  return `<h2><div class="ic">🗺️</div>${isCSR?'CSR2 · Iowa Corn Suitability Rating':'NCCPI · Crop Productivity Index'} <span class="source-tag">USDA soil survey</span></h2>

      ?'The rating Iowa land is priced, rented and taxed on, 5 to 100, from the soil survey map unit under each part of the field. It is a soil rating, not a soil test: it does not change with fertilizer.'

    </div></div>
    ${sm.rated>0?`<div class="lb" style="margin:8px 0 3px">Acres by ${lab}</div>
    ${sm.cls.map((ac,i)=>{if(ac<0.05)return'';const c=FERT_COLORS[i];return `<div class="vr-zone"><div class="vr-color" style="background:rgb(${c[0]},${c[1]},${c[2]})"></div>
      <span class="vr-range">${svRange(i)}</span><span class="vr-rate">${Math.round(ac/sm.total*100)}%</span><span class="vr-acres">${ac.toFixed(1)}ac</span></div>`;}).join('')}`:''}
    <div class="lb" style="margin:8px 0 3px">Soil map units · ${units.length}</div>
    ${units.map(u=>{const m=SV.mapunits[u.mukey]||{};const v=svValue(u.mukey);
      return `<div class="vr-zone" title="${attr(m.muname||'')}"><div class="vr-color" style="background:${svColor(v)}"></div>
        <span class="vr-range" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b>${m.musym||'?'}</b> ${m.muname||''}</span>
        <span class="vr-rate">${v==null?'—':isCSR?v:v.toFixed(0)}</span><span class="vr-acres">${u.ac.toFixed(1)}ac</span></div>`;}).join('')}`;
}
function rGap(){
  const set=activeSet(sel);if(!set)return'<div class="dn">No soil test on file, so nothing to hold against the soil rating. The CSR2 and NCCPI maps still show.</div>';

  const rating=svRatingAvg(sel);
  if(rating==null)return'<div class="dn">No map unit under this field carries a rating.</div>';
  const gap=rating-fert;
  const raster=genRaster(sel,null,null,true,makeGapFn(sel),GAP_BREAKS);
  const zac=raster?zoneAcres(raster,sel):null;
  const ac=(FPROP[sel]||{}).acres||0;
  const cls=Math.min(4,GAP_BREAKS.filter(b=>gap+100>=b).length);
  const hasCSR=svPieces(sel).some(pc=>(SV.mapunits[pc.mukey]||{}).csr2!=null);

    <div class="dn">${isComposite(sel)?COMPOSITE_NOTE+' ':''}What the ground can do (${hasCSR?'CSR2 and NCCPI together':'NCCPI; no CSR2 outside Iowa'}) against what the soil test says it does (the fertility score for ${on.map(k=>TH[k]?.rx||TH[k]?.nm||k).join(', ')}). <b>Red</b> is good ground testing poor: the fertility is what is holding it back, and fertilizer has the most to gain there. <b>Green</b> already tests as well as the ground deserves.</div>
    <div class="fc" style="padding:8px">

      </div>

    </div>
    ${rGapNeeds(set,ac)}
    <div class="dn" style="margin-top:8px">Both numbers run 0 to 100 but are not the same kind of thing: the rating is a property of the soil and never moves, the fertility score moves with every soil test. The gap is a way to rank ground, not a rate. Use the VR Rx tab for the rate.</div>`;
}
// Build-up to the top of the score, per nutrient: the level where each one
// stops limiting the fertility score, and what it takes to lift the field's
// average there. The same lb-per-ppm build factors as the rate functions,
// with no crop removal on top, averaged over the sample points. The
// product is whichever is picked for that nutrient on the VR Rx tab.
const CEILING={p:t=>t.hi,k:t=>t.hi,s:t=>t.hi,zn:t=>t.hi,ph:()=>6.2};
function buildToCeiling(k,pt){
  const t=TH[k],c=CEILING[k](t),v=pt[k];if(v==null)return null;
  if(k==='ph')return calcLimeRate(v,pt.bph,c);
  const per={p:PER_PPM.p,k:PER_PPM.k,s:2.5,zn:5}[k];
  return Math.max(0,(c-v)*per);}
function rGapNeeds(set,ac){
  const rows=FERT_NUTS.map(k=>{
    const t=TH[k],c=CEILING[k](t);
    const pts=set.pts.filter(p=>p[k]!=null);if(!pts.length)return null;
    const need=pts.reduce((a,p)=>a+buildToCeiling(k,p),0)/pts.length;
    const avg=pts.reduce((a,p)=>a+p[k],0)/pts.length;
    const short=pts.filter(p=>p[k]<c).length/pts.length;
    const prod=PRODUCTS[k][rxProd[k]||0];
    return{k,t,c,avg,need,short,prod,lbProd:need/prod.pct};
  }).filter(Boolean);
  if(!rows.length)return'';
  return `<div class="fc" style="padding:8px;margin-top:8px">
    <div class="lb" style="margin-bottom:3px">To reach full potential &middot; build-up only, no crop removal</div>
    ${rows.map(r=>{
      const there=r.need<0.5;
      const label=r.k==='ph'?'pH':r.t.nm;
      const tgt=r.k==='ph'?r.c.toFixed(1):r.c+' '+r.t.u;
      const now=r.k==='ph'?r.avg.toFixed(1):r.avg.toFixed(r.k==='zn'?1:0)+(r.t.u?' '+r.t.u:'');
      return `<div class="vr-zone" style="flex-wrap:wrap">
        <span class="vr-range" style="flex:1"><b>${label}</b> averages ${now}, top of score at ${tgt}${r.short>0&&r.short<1?` &middot; ${Math.round(r.short*100)}% of points short`:''}</span>
        <span class="vr-rate" style="min-width:0">${there?(r.short>0?'average already there':'already there'):`${Math.round(r.need)} lb ${NUTRIENT_NAME[r.k]}/ac`}</span>
        ${there?'':`<span class="vr-acres" style="min-width:0">${Math.round(r.lbProd)} lb/ac ${r.prod.name}${ac?` &middot; ${(r.lbProd*ac/2000).toFixed(r.lbProd*ac/2000<10?1:0)} ton`:''}</span>`}
      </div>`;}).join('')}
    <div class="dn" style="margin-top:4px;margin-bottom:0">The top of the score for P, K, sulfur and zinc is above the ISU optimum, so this is more than the ISU rate; it is what it takes to make the score read 100, not a recommendation. Pick the product on the VR Rx tab.</div>
  </div>`;
}
function rZones(){
  if(hNut==='yield')return rYieldPanel();
  if(hNut==='fert')return rFert();
  if(hNut==='gap')return rGap();
  if(isSurvey(hNut))return rSurvey();
  const fp=FP[sel];if(!fp||!fp.sets.length)return'<div class="dn">No soil data.</div>';
  if(isComposite(sel))return rComposite();
  const pts=activeSet(sel).pts;

// What a reading means in plain words, and whether "high" is a problem.
// Five verdicts: too low (red), a bit low (orange), good (green), plenty
// (blue: more than the crop can use, no harm), too high (purple: it is
// hurting something). The bar under it stays on the ISU categories.
const VERDICT={low:['Too low','var(--dn)'],bit:['A bit low','#f97316'],good:['Good','var(--ac)'],plenty:['Plenty','var(--in)'],high:['Too high','#8b5cf6'],info:['For reference','var(--tx2)']};
function plainWords(n,v,lt){
  const w=(k,txt,label)=>({k,label:label||VERDICT[k][0],color:VERDICT[k][1],txt});
  switch(n){
    case 'p':
      if(v<=9)return w('low','The crop will run short. Build it up.');
      if(v<=17)return w('bit','Corn and beans still gain from phosphorus here. Build it up over a few years.');
      if(v<=25)return w('good','Where it should be. Put back what the crop takes off and it stays here.');
      if(v<=34)return w('plenty','More than the crop can use; no phosphorus pays for yield. Not harmful.');
      return w('plenty','Far more than the crop can use; no phosphorus pays for years. It does not hurt the crop, but rain can carry it off to water.');
    case 'k':
      if(v<=125)return w('low','The crop will run short. Build it up.');
      if(v<=170)return w('bit','Corn and beans still gain from potash here. Build it up over a few years.');
      if(v<=220)return w('good','Where it should be. Put back what the crop takes off and it stays here.');
      if(v<=270)return w('plenty','More than the crop can use; no potash pays for yield. Not harmful.');
      return w('plenty','Far more than the crop can use; no potash pays for years. Not harmful.');
    case 'ph':
      if(v<5.5)return w('low','Too acid. Yields suffer and P and K are locked up. Lime.');
      if(v<6.0)return w('bit','A little acid for corn and beans. Lime pays.');
      if(v<=7.3)return w('good','Where corn and beans want it. No lime.');
      if(v<=7.8)return w('plenty','On the high side. Zinc, manganese and iron get harder for the crop to take up; watch beans for yellowing. Do not lime.','A bit high');
      return w('high','Alkaline. Iron and zinc tie-up is likely, especially in beans. It cannot be brought down cheaply; pick tolerant varieties and feed zinc if the test is low.');
    case 'om':
      if(v<2)return w('bit','Light ground that holds little water or nitrogen. Cover and residue help.');
      if(v<3.5)return w('good','Average for Iowa ground.');
      if(v<6)return w('plenty','Rich ground. It releases nitrogen on its own through the season.');
      return w('plenty','Very rich ground, often old wet or peaty soil. Releases a lot of nitrogen; not too much of anything.');
    case 'cec':
      if(v<10)return w('info','Sandy or light. Holds few nutrients, so smaller, more frequent doses hold better.');
      if(v<20)return w('info','Medium-textured ground. Holds nutrients normally.');
      return w('info','Heavy ground with a lot of clay or organic matter. Holds nutrients well and can take bigger doses less often. High is not a problem.');
    case 'ca':
      if(v<1000)return w('bit','Low, and usually goes with low pH. Lime fixes both.');
      if(v<3000)return w('good','Fine.');
      return w('plenty','Plenty, often from lime in the subsoil. It only matters through pH. Not harmful.');
    case 'mg':
      if(v<100)return w('bit','Low. Use dolomitic lime if the field needs lime anyway.');
      if(v<300)return w('good','Fine.');
      if(v<600)return w('plenty','Plenty. Not harmful.');
      return (lt&&lt.k!=null&&lt.k<170)?w('high','Very high, and potassium is low here. That much magnesium crowds potassium out of the plant; potash matters more on this field.'):w('plenty','Very high. Harmless while potassium is adequate.');
    case 's':
      if(v<6)return w('low','Low. Corn and beans answer to sulfur here.');
      if(v<10)return w('bit','Borderline. A little sulfur with the nitrogen is cheap insurance.');
      if(v<24)return w('good','Enough.');
      return w('plenty','Plenty. Not harmful.');
    case 'zn':
      if(v<0.9)return w('low','Low. Corn answers to zinc, most on high-pH ground.');
      if(v<2)return w('good','Enough.');
      if(v<20)return w('plenty','Plenty. No zinc pays. Not harmful.');
      return w('high','Very high, often from years of manure. Beans can show zinc toxicity at this level on low-pH ground; check the pH.');
    case 'mn':
      if(v<5)return w('bit','Low. Beans on high-pH ground can go yellow; a foliar shot fixes it.');
      if(v<30)return w('good','Fine.');
      return (lt&&lt.ph!=null&&lt.ph<5.5)?w('high','High on acid ground, where manganese turns toxic. Lime is the fix.'):w('plenty','Plenty. Harmless unless the pH drops under 5.5.');
    case 'bph':
      return w('info',`The lime test, not a nutrient. It says how much lime a low pH needs: the lower this number, the more lime.${lt&&lt.ph!=null?(lt.ph>=6.2?' With the pH where it is, no lime is needed, so this number does not matter here.':' With the pH low here, this sets the lime rate.'):''}`);
  }
  return null;
}
// One line for the field: what needs doing, what to watch, and what is fine.
function soilBottomLine(lt,nuts){
  const need=[],watch=[],fine=[];
  for(const n of nuts){const v=lt[n];if(v==null)continue;const pw=plainWords(n,v,lt);if(!pw)continue;
    const nm=TH[n]?TH[n].nm.replace(/ \(.*\)/,''):n;
    if(pw.k==='low'||pw.k==='bit')need.push(nm);else if(pw.k==='high')watch.push(nm);else if(pw.k!=='info')fine.push(nm);}
  return `<div class="dn" style="margin-bottom:8px">
    <b>${need.length?`Needs something: ${need.join(', ')}.`:'Nothing on this test is short.'}</b>
    ${watch.length?` <b style="color:#c4b5fd">Too high and worth watching: ${watch.join(', ')}.</b>`:''}
    ${fine.length?` Fine or plenty: ${fine.join(', ')}.`:''}
    <span style="display:block;margin-top:3px">"Plenty" means more than the crop can use and no harm done; "too high" means it is hurting something. The bar is where the number sits on Iowa State's scale.</span></div>`;
}

// When the whole field asks for nothing, the map is one zone and the zone
// list reads "0 → 0", which looks like the soil test never made it to
// this tab. It did: every spot is above target. Say so, with the numbers.
function nothingNeeded(zoneBreak){
  if(!zoneBreak.length||zoneBreak.some(z=>z.rate>0))return'';
  const set=activeSet(sel);if(!set)return'';
  const key=rxNut==='ph'?'ph':rxNut;
  const vals=set.pts.map(p=>p[key]).filter(v=>v!=null);if(!vals.length)return'';
  const t={p:rxTargetP,k:rxTargetK,ph:rxTargetPH,s:rxTargetS,zn:rxTargetZn}[rxNut];
  const nm=TH[key]?.nm||rxNut,u=TH[key]?.u||'';
  const mn=Math.min(...vals),mx=Math.max(...vals);
  const fmt=v=>rxNut==='ph'?v.toFixed(1):rxNut==='zn'?v.toFixed(1):Math.round(v);
  const below=vals.filter(v=>v<t).length;
  return `<div class="dn" style="border-left:3px solid var(--ac)"><b>Nothing to spread.</b> ${nm} tests ${fmt(mn)} to ${fmt(mx)}${u?' '+u:''} across this field against a target of ${fmt(t)}${u?' '+u:''}${below?` (${below} of ${vals.length} points under it, but not enough to make a zone)`:', so no spot is under it'}. The map is one zone at 0 because the soil test says so, not because it is missing; the pattern is on the Nutrient Map tab.${mn>=t?'':' A higher target on the slider would put a rate on the low spots.'}${(rxNut==='p'||rxNut==='k')?' The soil bank above the level to hold covers the goal on every acre; the line above the basis buttons says for how long. Switch <b>Rate basis</b> to crop removal at goal to put what the crop takes off on regardless.':''}</div>`;
}

// The goal against what the field has actually grown: a 350 bu goal on
// ground that averages 228 takes off 46 lb more P2O5 an acre than the
// field is used to giving back, and that is the "how much more" a bigger
// crop asks for. Shown per acre and for the field, in the chosen product.
function goalGapNote(cropAvg,goal,prod){
  const per=removalPerBu(rxNut,rxCrop);
  const ac=(FPROP[sel]||{}).acres||0,nut=NUTRIENT_NAME[rxNut];
  const off='';
  if(!cropAvg)return `<div style="font-size:8px;color:var(--tx2);padding:0 0 6px 86px;line-height:1.4">No ${rxCrop} harvest on file to compare the goal against, so the removal above is the whole of what a ${goal} bu crop takes off.${off}</div>`;
  const diff=(goal-cropAvg)*per,prodLb=diff/prod.pct;
  if(Math.abs(diff)<1)return `<div style="font-size:8px;color:var(--tx2);padding:0 0 6px 86px;line-height:1.4">The goal is what this field already averages (${cropAvg} bu).${off}</div>`;
  const more=diff>0;
  return `<div style="font-size:8px;color:var(--tx2);padding:0 0 6px 86px;line-height:1.4">To grow <b style="color:var(--tx)">${goal} bu</b> instead of the <b style="color:var(--tx)">${cropAvg} bu</b> this field averages takes <b style="color:var(--tx)">${Math.abs(Math.round(diff))} lb ${nut}/ac ${more?'more':'less'}</b> (${Math.abs(Math.round(prodLb))} lb/ac ${prod.name}${ac?`, ${(Math.abs(prodLb)*ac/2000).toFixed(1)} tons ${more?'more':'less'} over ${ac.toFixed(0)} ac`:''}).${off}</div>`;
}
// The field's bank: soil test above the level to hold, in lb of nutrient,
// against what the goal takes off each year.
function soilBankNote(goal,prod){
  const set=activeSet(sel);if(!set)return'';
  const k=rxNut,tgt=k==='p'?rxTargetP:rxTargetK,per=PER_PPM[k],nut=NUTRIENT_NAME[k];
  const vals=set.pts.map(p=>p[k]).filter(v=>v!=null);if(!vals.length)return'';
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const removal=goal*removalPerBu(k,rxCrop);
  const under=vals.filter(v=>v<tgt).length;
  const bank=(avg-tgt)*per;
  let line;
  if(bank>0){const yrs=bank/removal;
    line=`The soil averages <b>${avg.toFixed(0)} ppm</b> against <b>${tgt}</b> to hold: a bank of about <b>${Math.round(bank)} lb ${nut}/ac</b>, which is <b>${yrs>=20?'20+':yrs.toFixed(yrs<2?1:0)} years</b> of a ${goal} bu ${rxCrop} crop (${Math.round(removal)} lb/ac a year) before the test falls to ${tgt}.`;}
  else line=`The soil averages <b>${avg.toFixed(0)} ppm</b>, under the <b>${tgt}</b> to hold: about <b>${Math.round(-bank)} lb ${nut}/ac</b> of build-up, spread over ${BUILD_YEARS} years (${Math.round(-bank/BUILD_YEARS)} lb a year) on top of the ${Math.round(removal)} lb a ${goal} bu crop takes off.`;
  if(under&&under<vals.length)line+=` ${Math.round(under/vals.length*100)}% of the samples are under ${tgt} and get build-up.`;
  return `<div style="font-size:8px;color:var(--tx2);padding:0 0 6px 86px;line-height:1.4">${line} At ${per} lb per ppm (ISU/NRCS 2023).</div>`;
}
// What ground rated like this has made on this farm. Across every field
// with a soil rating and a harvest of the crop, the best year per rating
// point; the 90th percentile of that times this field's rating is what
// the farm's own record says this ground can do.
const ceilingCache={};
function ratingCeiling(f,crop){
  const rating=svRatingAvg(f);if(rating==null)return null;
  if(!ceilingCache[crop]){
    const ratios=[];
    for(const g of Object.keys(OPS)){const r=svRatingAvg(g);if(!r)continue;
      const best=Math.max(0,...harvestHistory(g).filter(h=>h.crop===crop&&h.avg&&(h.acres||0)>=20).map(h=>h.avg));
      if(best>0)ratios.push(best/r);}
    ratios.sort((a,b)=>a-b);
    ceilingCache[crop]=ratios.length>=5?{per:ratios[Math.floor(ratios.length*0.9)],n:ratios.length}:null;}
  const c=ceilingCache[crop];if(!c)return null;
  return{bu:Math.round(c.per*rating/5)*5,rating,per:c.per,n:c.n};
}
function ceilingNote(goal){
  const c=ratingCeiling(sel,rxCrop);if(!c)return'';
  const over=goal>c.bu;
  return `<div style="font-size:8px;color:var(--tx2);padding:0 0 6px 86px;line-height:1.4">This ground rates <b>${c.rating.toFixed(0)}</b> (CSR2/NCCPI). Over ${c.n} of your fields, the best ${rxCrop} year on the top ground ran ${c.per.toFixed(1)} bu per rating point, so about <b>${c.bu} bu</b> is what ground rated like this has shown it can make here.${over?` <span style="color:var(--wr)">A ${goal} goal is above that.</span>`:''}</div>`;
}
function varyNote(ym){
  const rated=svRatingAvg(sel)!=null;
  const yTxt=ym.length?`<b>${ym.length} yield map${ym.length>1?'s':''}</b> (${ym.map(m=>m.season).join(', ')})`:'';
  const rTxt=rated?`the <b>soil rating</b> (CSR2/NCCPI, field ${svRatingAvg(sel).toFixed(0)})`:'';
  let src='';
  if(rxVary==='yield')src=yTxt;
  else if(rxVary==='rating')src=rTxt;
  else src=[yTxt,rTxt].filter(Boolean).join(' and ');
  const above=(rxNut==='p'||rxNut==='k')?(rxBasis==='removal'?' The rate is <b>what the crop takes off</b> at the goal; the soil test does not enter into it.':' The rate is the crop\'s need at the goal <b>on top of what the soil holds</b> above the level to hold.'):'';
  return (src?`Removal varies by spot from ${src}.`:'Nothing to vary the removal by, so it is flat across the field.')+above;
}
function setPreset(nut,preset){
  if(nut==='p')rxTargetP={low:17,optimum:25,high:34}[preset]||25;
  if(nut==='k')rxTargetK={low:170,optimum:220,high:270}[preset]||220;
  if(nut==='ph'){rxTargetPH=preset==='nw_iowa'?6.0:6.5;}
  if(nut==='s'){
    if(preset==='low')rxTargetS=8;
    else if(preset==='standard')rxTargetS=10;
    else if(preset==='high')rxTargetS=15;
  }
  if(nut==='zn'){
    if(preset==='maintain')rxTargetZn=0.9;
    else if(preset==='build')rxTargetZn=1.5;
    else if(preset==='high')rxTargetZn=2.0;
  }
  rP();showVRInterp();
}

// Map
function initMap(){
  if(map){map.remove();map=null;canvasOverlay=null;ptsLayer=null;}
  map=L.map('map',{zoomControl:false,attributionControl:false}).setView([42.7,-93.8],8);
  L.control.zoom({position:'bottomright'}).addTo(map);
  sTiles();addBounds();
  if(!sel&&!initMap.fitted){initMap.fitted=true;try{map.fitBounds(L.geoJSON(B).getBounds(),{padding:[20,20]});}catch(e){}}
  if(sel)setTimeout(()=>{if(panelTab==='zones'||panelTab==='vr')showInterp();},100);
}
function sTiles(){if(!map)return;map.eachLayer(l=>{if(l._url)map.removeLayer(l);});
  const urls={satellite:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    topo:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
    roads:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'};
  L.tileLayer(urls[mLyr]||urls.satellite,{maxZoom:19}).addTo(map);}

function addBounds(){
  if(!map)return;fLayers={};
  L.geoJSON(B,{
    style:feat=>{const f=feat.properties.field,isSel=sel===f,sampled=!!FP[f];
      // Sampled fields bright, unsampled ones dimmer; the selected one green.
      return{color:isSel?'#4ade80':sampled?'rgba(255,255,255,0.85)':'rgba(255,255,255,0.4)',weight:isSel?3:sampled?1.8:1.2,
        fillColor:isSel?'rgba(74,222,128,0.08)':'rgba(255,255,255,0.06)',fillOpacity:1,
        dashArray:isSel?null:'4 2'};},
    onEachFeature:(feat,layer)=>{const p=feat.properties,f=p.field;fLayers[f]=layer;
      const lt=activeInfo(f);
      let tt=`<b>${f}</b><br>${p.org} · ${p.farm}${p.acres!=null?` · ${p.acres.toFixed(1)} ac`:''}`;
      const lc=seasonCrop(f,META.plan_year-1);if(lc)tt+=`<br>${META.plan_year-1}: ${lc}`;
      if(lt&&(hNut==='fert'||hNut==='gap')){const fs=fertScore(lt);
        tt+=`<br>Fertility: ${fs!=null?fs+'/100':'N/A'}<br>Sampled: ${lt.d}`;
        if(hNut==='gap'){const r=svRatingAvg(f);if(r!=null&&fs!=null)tt+=`<br>Soil rating ${r.toFixed(0)} · ${r-fs>=0?'behind':'ahead'} by ${Math.abs(r-fs).toFixed(0)}`;}}
      else if(lt){tt+=`<br>${TH[hNut]?.nm||hNut}: ${lt[hNut]!=null?lt[hNut]:'N/A'}<br>Sampled: ${lt.d}`;}
      else tt+='<br>no soil test';
      const ym=yieldMaps(f);if(ym.length)tt+=`<br>yield maps: ${ym.map(m=>m.season).join(', ')}`;
      layer.bindTooltip(tt,{sticky:true,className:'ftt'});
      layer.on('click',()=>sF(f));}
  }).addTo(map);
}

// The lab's own sample points, on top of whatever map is showing.
//
// Every map on this page is interpolated: the colour between the samples is
// a guess from the four nearest. These pins are the readings themselves, so
// you can see where the lab actually went and what it found there. They ride
// over every map view, and each pin is coloured the way that map colours

// The colour this map would give one sample's reading.
function ptColor(pt){
  if(hNut==='fert'){const v=fertScore(pt);return v==null?'#94a3b8':`rgb(${FERT_COLORS[Math.min(4,FERT_BREAKS.filter(b=>v>b).length)].join(',')})`;}
  if(hNut==='gap'){const fs=fertScore(pt),r=svRatingAt(sel,pt.x,pt.y);
    if(fs==null||r==null)return'#94a3b8';
    const g=100+r-fs;return `rgb(${GAP_COLORS[Math.min(4,GAP_BREAKS.filter(b=>g>=b).length)].join(',')})`;}
  if(hNut==='vr'){const fn=currentRateFn(sel),v=fn(pt,pt.x,pt.y);
    if(v==null)return'#94a3b8';
    const r=lastVR;if(!r||!(r.vmax>0))return'rgb(40,95,200)';
    const cols=rateColors(r),nz=cols.length,rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
    if(r.zeroZone)return rgb(v<=0?cols[0]:cols[Math.min(nz-1,1+Math.floor(v/r.vmax*(nz-1)))]);
    return rgb(cols[Math.min(nz-1,Math.floor((v-r.vmin)/((r.vmax-r.vmin)||1)*nz))]);}
  if(hNut==='yield'){const v=yieldIndexAt(sel,pt.x,pt.y);
    if(v==null)return'#94a3b8';
    let k=0;while(k<YIELD_BREAKS.length&&v>=YIELD_BREAKS[k])k++;
    return `rgb(${YIELD_COLORS[k].join(',')})`;}
  if(isSurvey(hNut)){const v=svValue((svPieces(sel).find(pc=>{const rings=pc.rings.map(rg=>rg.map(q=>[q[1],q[0]]));return pip(pt.x,pt.y,rings[0])&&!rings.slice(1).some(h=>pip(pt.x,pt.y,h));})||{}).mukey);
    return svColor(v);}
  const v=pt[hNut];if(v==null)return'#94a3b8';
  const bk=mapBreaks(hNut);if(!bk)return'#94a3b8';
  const cols=bandColors(bk.length+1);let z=0;while(z<bk.length&&v>bk[z])z++;

}

// A pin shows what the map is showing. On a single-nutrient map the pin

function ptRow(k,nm,pt,big){

// The link inside an open popup, without closing it.

function renderPts(){

  if(!ptsOn||!sel||!map)return;
  const set=activeSet(sel);if(!set||!set.pts||!set.pts.length)return;
  const composite=isComposite(sel);
  // A composite is one lab sample spread over the field as identical

  // lie about where the lab went. One pin in the middle, labelled.
  const pts=composite?[set.pts[Math.floor(set.pts.length/2)]]:set.pts;
  ptsLayer=L.layerGroup();

      fillColor:ptColor(pt),fillOpacity:.95});

// The VR panel's controls redraw through here. The map is whatever the

// The multi-year yield index as a map layer: every 20 m cell coloured by how
// it yields against the field average, averaged over the harvests on file.
function renderYieldOverlay(f){
  const maps=yieldMaps(f);if(!maps.length||!map)return null;
  const fr=fieldRings(f);
  const lon0=Math.min(...maps.map(m=>m.lon0)),lat0=Math.min(...maps.map(m=>m.lat0));
  const lon1=Math.max(...maps.map(m=>m.lon0+m.nx*m.dlon)),lat1=Math.max(...maps.map(m=>m.lat0+m.ny*m.dlat));
  const dlon=maps[0].dlon,dlat=maps[0].dlat;
  const nx=Math.ceil((lon1-lon0)/dlon),ny=Math.ceil((lat1-lat0)/dlat),scale=4;
  const canvas=document.createElement('canvas');canvas.width=nx*scale;canvas.height=ny*scale;
  const ctx=canvas.getContext('2d');
  ctx.beginPath();
  fr.ext.concat(fr.holes).forEach(ring=>{ring.forEach((c,i)=>{const px=(c[0]-lon0)/dlon*scale,py=(ny-(c[1]-lat0)/dlat)*scale;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);});ctx.closePath();});
  ctx.clip('evenodd');
  for(let iy=0;iy<ny;iy++){const y=lat0+(iy+0.5)*dlat;
    for(let ix=0;ix<nx;ix++){const x=lon0+(ix+0.5)*dlon;
      const v=yieldIndexAt(f,x,y,0);if(v==null)continue;
      let k=0;while(k<YIELD_BREAKS.length&&v>=YIELD_BREAKS[k])k++;
      const c=YIELD_COLORS[k];ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},0.85)`;
      ctx.fillRect(ix*scale,(ny-1-iy)*scale,scale,scale);}}
  const bounds=[[lat0,lon0],[lat0+ny*dlat,lon0+nx*dlon]];
  return L.imageOverlay(canvas.toDataURL(),bounds,{opacity:0.9,interactive:false}).addTo(map);
}

// Pixel-perfect raster rendering for map display.
// Each pixel has exactly ONE zone — no overlaps, no color artifacts.
// Canvas clip path clips precisely to field boundary.
function renderRasterOnMap(raster,fr,colors){
  const {zoneGrid,mask,snx,sny,xmin,ymin,sRES}=raster;
  const scale=6;
  const w=snx*scale,h=sny*scale;
  
  // Compute shared boundary smooth vertices
  const intEdges={};
  for(let y=0;y<sny;y++){for(let x=0;x<snx;x++){
    const ci=y*snx+x;if(!mask[ci]||!zoneGrid[ci])continue;const za=zoneGrid[ci];
    if(x<snx-1){const ri=y*snx+(x+1);if(mask[ri]&&zoneGrid[ri]&&zoneGrid[ri]!==za){
      const zb=zoneGrid[ri],key=Math.min(za,zb)+'-'+Math.max(za,zb);
      if(!intEdges[key])intEdges[key]=[];intEdges[key].push({x1:x+1,y1:y,x2:x+1,y2:y+1});}}
    if(y<sny-1){const bi=(y+1)*snx+x;if(mask[bi]&&zoneGrid[bi]&&zoneGrid[bi]!==za){
      const zb=zoneGrid[bi],key=Math.min(za,zb)+'-'+Math.max(za,zb);
      if(!intEdges[key])intEdges[key]=[];intEdges[key].push({x1:x,y1:y+1,x2:x+1,y2:y+1});}}
  }}
  const spm={};
  for(const [key,edges] of Object.entries(intEdges)){
    const lns=chainEdges(edges);
    for(const ln of lns){const gl=ln.map(([px2,py2])=>[xmin+px2*sRES,ymin+py2*sRES]);
      const sm=smoothPolyline(gl);
      for(let i=0;i<ln.length;i++){const pk=ln[i][0]+','+ln[i][1];
        const t=ln.length>1?i/(ln.length-1):0;const si2=Math.min(sm.length-1,Math.round(t*(sm.length-1)));
        spm[pk]=sm[si2];}}}
  
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');
  
  // Clip to the field: every part, with its cutouts left clear (even-odd).
  ctx.beginPath();
  fr.ext.concat(fr.holes).forEach(ring=>{
    ring.forEach((c,i)=>{
      const px=(c[0]-xmin)/sRES*scale,py=(sny-(c[1]-ymin)/sRES)*scale;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    });
    ctx.closePath();
  });
  ctx.clip('evenodd');
  
  // Draw each zone as smoothed polygons using shared boundary vertices
  // All rings of same zone in one path, one fill call. Every class the
  // raster carries, not a fixed five: the lab's phosphorus and zinc bands
  // run to six, and the sixth - the richest ground - went unpainted and
  // showed as holes in the map.
  for(let z=1;z<=(raster.nz||NZONES);z++){
    const bin=new Uint8Array(snx*sny);
    for(let i2=0;i2<snx*sny;i2++){if(mask[i2]&&zoneGrid[i2]===z)bin[i2]=1;}
    const pixRings=vectorizeZoneBoundary(bin,snx,sny);
    if(!pixRings.length)continue;
    const c=colors[(z-1)%colors.length];
    ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.beginPath();
    for(const pRing of pixRings){
      let first=true;
      for(let i2=0;i2<pRing.length;i2++){
        const px=pRing[i2][0],py=pRing[i2][1],pk=px+','+py;
        const pt=spm[pk]||[xmin+px*sRES,ymin+py*sRES];
        const cx2=(pt[0]-xmin)/sRES*scale,cy2=(sny-(pt[1]-ymin)/sRES)*scale;
        if(first){ctx.moveTo(cx2,cy2);first=false;}
        else ctx.lineTo(cx2,cy2);
      }
      ctx.closePath();
    }
    ctx.fill('evenodd');
  }
  
  // Thin contour lines between different zones only
  ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1;
  for(const [key,edges] of Object.entries(intEdges)){
    const lns=chainEdges(edges);
    for(const ln of lns){
      const gl=ln.map(([px2,py2])=>[xmin+px2*sRES,ymin+py2*sRES]);
      const sm=smoothPolyline(gl);
      ctx.beginPath();
      for(let i2=0;i2<sm.length;i2++){
        const cx2=(sm[i2][0]-xmin)/sRES*scale,cy2=(sny-(sm[i2][1]-ymin)/sRES)*scale;
        if(i2===0)ctx.moveTo(cx2,cy2);else ctx.lineTo(cx2,cy2);
      }
      ctx.stroke();
    }
  }
  
  const bounds=[[ymin,xmin],[ymin+sny*sRES,xmin+snx*sRES]];
  return L.imageOverlay(canvas.toDataURL(),bounds,{opacity:0.9,interactive:false}).addTo(map);
}

function productFor(nut){return PRODUCTS[nut][rxProd[nut]||0];}
// Zone polygons for one field: the rate raster vectorised part by part and
// clipped to each part's true boundary, then written in pounds of product.
// Farmstead cutouts are not cut out of the zones (the boundary in the
// monitor stops the spreader there); their acres are left out of totals.
function exportZones(f,rateFn,nut,crop,yg){
  const fp=FP[f];if(!fp||!fp.sets.length)return null;
  const raster=genRaster(f,null,null,true,rateFn);if(!raster)return null;
  const pts=activeSet(f).pts;
  const rates=pts.map(rateFn).filter(r=>r!=null);if(!rates.length)return null;
  const rMin=Math.min(...rates),rMax=Math.max(...rates),rRange=rMax-rMin||1;
  const unit=nut==='ph'?'lb_ECC_ac':'lb_ac';
  const fr=fieldRings(f),byZone={};
  fr.ext.forEach(ring=>{
    const recs=buildSmoothedZoneExport(maskToRing(raster,ring),ring,rMin,rRange,NUTRIENT_NAME[nut],crop,yg,unit);
    recs.forEach(r=>{if(!byZone[r.id])byZone[r.id]=Object.assign({},r,{parts:[]});byZone[r.id].parts.push(...r.parts);});
  });
  const prod=productFor(nut),zac=zoneAcres(raster,f);
  const records=Object.values(byZone).sort((a,b)=>a.id-b.id);
  // The rate a zone is written at is the mean of the rates actually
  // computed inside it, over the whole field, not the middle of its band.
  // The bands are equal slices of [min,max], but the recommendation is not
  // spread evenly through them: P and K return exactly 0 at or above
  // target, so most fields are a big block of zeros and a few high spots,
  // and the band midpoint put fertiliser on ground the model had said
  // needed none.
  // Zone 1 of a rate map with a no-application zone means exactly that.
  // A stray cell or two swept in by the zone tidying must not turn "spread
  // nothing here" into a few pounds an acre across most of the field.
  const zs=zoneStats(raster,f);
  records.forEach(r=>{const o=zs[r.id];if(o&&o.n){r.rate=o.mean;r.rate_lo=Math.round(o.lo);r.rate_hi=Math.round(o.hi);}});
  records.forEach(r=>{r.parts=orientParts(r.parts);
    r.nutrient=NUTRIENT_NAME[nut];r.nut_rate=r.rate;r.nut_lo=r.rate_lo;r.nut_hi=r.rate_hi;
    r.product=prod.name;r.analysis=Math.round(prod.pct*100);
    r.rate=Math.round(r.nut_rate/prod.pct);r.product_1=r.rate;r.acres=zac[r.id]||0;r.field=f;});

  // order: drop it rather than ship a record the spreader cannot use.

}
// The raster with its mask limited to one part's bounding box, so the
// vectoriser only sees that part (parts of one field sit apart, across a road).
// The raster trimmed to ONE part of a multi-part field.
//
// This used to trim by the part's bounding box, which on a field of two or
// three separate pieces left every cell lying between them switched on, so
// that part's zone polygon swallowed the ground in between - 24 acres on
// Harnish285Polk2E. A cell is now kept only if it touches the ring itself.
function maskToRing(raster,ring){
  const {snx,sny,sRES,xmin,ymin}=raster;
  const xs=ring.map(c=>c[0]),ys=ring.map(c=>c[1]),pad=sRES;
  const x0=Math.min(...xs)-pad,x1=Math.max(...xs)+pad,y0=Math.min(...ys)-pad,y1=Math.max(...ys)+pad;
  const mask=new Uint8Array(raster.mask),h=sRES/2;
  for(let iy=0;iy<sny;iy++){
    const cy=ymin+(iy+0.5)*sRES;
    for(let ix=0;ix<snx;ix++){
      const i=iy*snx+ix;if(!mask[i])continue;
      const cx=xmin+(ix+0.5)*sRES;
      if(cx<x0||cx>x1||cy<y0||cy>y1){mask[i]=0;continue;}
      if(!(pip(cx,cy,ring)||pip(cx-h,cy-h,ring)||pip(cx+h,cy-h,ring)||
           pip(cx-h,cy+h,ring)||pip(cx+h,cy+h,ring)))mask[i]=0;
    }
  }
  return Object.assign({},raster,{mask});
}
function ringArea(r){let a=0;for(let i=0;i<r.length-1;i++)a+=r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1];return a/2;}
// Shapefile rule: outer rings clockwise, holes counter-clockwise. A ring is
// a hole when it sits inside an odd number of the record's other rings
// (three probe vertices vote, since clipped rings share edge points).
// Points that are strictly inside a ring, for deciding what it encloses.
// Probing with the ring's own vertices is a coin flip: a clipped ring
// shares its vertices with the boundary it was clipped against, and a
// point-in-polygon test on a shared vertex can answer either way. 18 of
// 5,450 exported rings came out inside-out that way, which tells a reader
// a 15-acre hole is solid ground.
function insidePoints(ring,want){
  const xs=ring.map(c=>c[0]),ys=ring.map(c=>c[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const out=[],N=12;
  for(let i=1;i<N&&out.length<want;i++)for(let j=1;j<N&&out.length<want;j++){
    const x=x0+(x1-x0)*i/N,y=y0+(y1-y0)*j/N;
    if(pip(x,y,ring))out.push([x,y]);
  }
  return out;
}
function orientParts(parts){
  return parts.map((ring,i)=>{
    const probes=insidePoints(ring,9);
    let votes=0;
    probes.forEach(p=>{let depth=0;for(let j=0;j<parts.length;j++){if(j!==i&&pip(p[0],p[1],parts[j]))depth++;}if(depth%2===1)votes++;});
    const hole=probes.length?votes*2>probes.length:false,ccw=ringArea(ring)>0;
    return hole!==ccw?ring.slice().reverse():ring;});
}
