// Vectorize a binary zone mask into polygon rings by collecting boundary edges
// and chaining them into ordered closed rings.
function vectorizeZoneBoundary(bin,w,h){
  const edges=[];
  for(let y=0;y<h;y++){for(let x=0;x<w;x++){
    if(!bin[y*w+x])continue;
    if(y===0||!bin[(y-1)*w+x])edges.push({x1:x,y1:y,x2:x+1,y2:y});
    if(y===h-1||!bin[(y+1)*w+x])edges.push({x1:x,y1:y+1,x2:x+1,y2:y+1});
    if(x===0||!bin[y*w+(x-1)])edges.push({x1:x,y1:y,x2:x,y2:y+1});
    if(x===w-1||!bin[y*w+(x+1)])edges.push({x1:x+1,y1:y,x2:x+1,y2:y+1});
  }}
  if(!edges.length)return[];
  const ve={};
  edges.forEach((e,i)=>{
    const k1=e.x1+','+e.y1,k2=e.x2+','+e.y2;
    if(!ve[k1])ve[k1]=[];if(!ve[k2])ve[k2]=[];
    ve[k1].push(i);ve[k2].push(i);
  });
  const used=new Uint8Array(edges.length);
  const rings=[];
  for(let si=0;si<edges.length;si++){
    if(used[si])continue;
    const ring=[];let ci=si,cv=edges[ci].x1+','+edges[ci].y1;
    for(let it=0;it<edges.length+10;it++){
      used[ci]=1;const e=edges[ci];
      const v1=e.x1+','+e.y1,v2=e.x2+','+e.y2;
      const nv=(cv===v1)?v2:v1;
      ring.push(nv.split(',').map(Number));
      const cands=ve[nv];let ni=-1;
      if(cands)for(const c of cands)if(!used[c]){ni=c;break;}
      if(ni===-1)break;ci=ni;cv=nv;
    }
    if(ring.length>=3){ring.push([ring[0][0],ring[0][1]]);rings.push(ring);}
  }
  return rings;
}

// Chain edge segments into polylines (open, not closed rings)
function chainEdges(edges){
  if(!edges.length)return[];
  const ve={};
  edges.forEach((e,i)=>{
    const k1=e.x1+','+e.y1,k2=e.x2+','+e.y2;
    if(!ve[k1])ve[k1]=[];if(!ve[k2])ve[k2]=[];
    ve[k1].push(i);ve[k2].push(i);
  });
  const used=new Uint8Array(edges.length);
  const lines=[];
  for(let si=0;si<edges.length;si++){
    if(used[si])continue;
    const line=[];let ci=si,cv=edges[ci].x1+','+edges[ci].y1;
    line.push(cv.split(',').map(Number));
    for(let it=0;it<edges.length+10;it++){
      used[ci]=1;const e=edges[ci];
      const v1=e.x1+','+e.y1,v2=e.x2+','+e.y2;
      const nv=(cv===v1)?v2:v1;
      line.push(nv.split(',').map(Number));
      const cands=ve[nv];let ni=-1;
      if(cands)for(const c of cands)if(!used[c]){ni=c;break;}
      if(ni===-1)break;ci=ni;cv=nv;
    }
    if(line.length>=2)lines.push(line);
  }
  return lines;
}

// Smooth an open polyline (keeping endpoints fixed)
function smoothPolyline(pts){
  if(pts.length<3)return pts;
  let r=pts.slice();
  // Gaussian averaging (3 passes, window=2, endpoints fixed)
  for(let pass=0;pass<3;pass++){
    const n=r.length;const s=[];
    for(let i=0;i<n;i++){
      if(i<=1||i>=n-2){s.push(r[i]);continue;}
      let sx=0,sy=0,cnt=0;
      for(let d=-2;d<=2;d++){sx+=r[i+d][0];sy+=r[i+d][1];cnt++;}
      s.push([sx/cnt,sy/cnt]);
    }
    r=s;
  }
  // Douglas-Peucker
  r=douglasPeucker(r,0.00003);
  // Chaikin on open polyline (3 passes, keep endpoints)
  for(let pass=0;pass<3;pass++){
    const o=[];
    for(let i=0;i<r.length-1;i++){
      const p0=r[i],p1=r[i+1];
      if(i===0)o.push(p0);
      o.push([p0[0]*0.75+p1[0]*0.25,p0[1]*0.75+p1[1]*0.25]);
      o.push([p0[0]*0.25+p1[0]*0.75,p0[1]*0.25+p1[1]*0.75]);
      if(i===r.length-2)o.push(p1);
    }
    r=o;
  }
  return r;
}

// ===== SHARED-BOUNDARY EXPORT =====
// Zone-to-zone boundaries computed ONCE, shared by both neighbors = zero gaps.
function buildSmoothedZoneExport(raster,fieldRing,rMin,rRange,product,crop,yg,unit){
  const {zoneGrid,mask,snx,sny,xmin,ymin,sRES}=raster;
  const denseBdy=densifyRing(fieldRing,sRES*0.4);
  
  // Step 1: Collect internal boundary edges keyed by zone pair
  const intEdges={}; // "za-zb" -> [edges]
  for(let y=0;y<sny;y++){for(let x=0;x<snx;x++){
    const ci=y*snx+x;if(!mask[ci]||!zoneGrid[ci])continue;
    const za=zoneGrid[ci];
    if(x<snx-1){const ri=y*snx+(x+1);if(mask[ri]&&zoneGrid[ri]&&zoneGrid[ri]!==za){
      const zb=zoneGrid[ri],key=Math.min(za,zb)+'-'+Math.max(za,zb);
      if(!intEdges[key])intEdges[key]=[];
      intEdges[key].push({x1:x+1,y1:y,x2:x+1,y2:y+1});
    }}
    if(y<sny-1){const bi=(y+1)*snx+x;if(mask[bi]&&zoneGrid[bi]&&zoneGrid[bi]!==za){
      const zb=zoneGrid[bi],key=Math.min(za,zb)+'-'+Math.max(za,zb);
      if(!intEdges[key])intEdges[key]=[];
      intEdges[key].push({x1:x,y1:y+1,x2:x+1,y2:y+1});
    }}
  }}
  
  // Step 2: Chain and smooth each shared boundary ONCE
  // Store as lookup: pixel coord -> smoothed geo coord
  const smoothPtMap={}; // "px,py" -> [geoX, geoY]
  
  for(const [key,edges] of Object.entries(intEdges)){
    const lines=chainEdges(edges);
    for(const line of lines){
      // Convert to geo
      const geoLine=line.map(([px,py])=>[xmin+px*sRES,ymin+py*sRES]);
      const smoothed=smoothPolyline(geoLine);
      // Map original pixel vertices to their smoothed positions
      // Interpolate: original line has N points, smoothed has M points
      // Map each original point to the nearest smoothed point
      for(let i=0;i<line.length;i++){
        const pk=line[i][0]+','+line[i][1];
        // Find position along smoothed line proportional to i/(N-1)
        const t=line.length>1?i/(line.length-1):0;
        const si=Math.min(smoothed.length-1,Math.round(t*(smoothed.length-1)));
        smoothPtMap[pk]=smoothed[si];
      }
    }
  }
  
  // Step 3: Build zone polygons using shared smoothed coordinates
  const records=[];
  for(let z=1;z<=(raster.nz||NZONES);z++){
    const bin=new Uint8Array(snx*sny);
    for(let i=0;i<snx*sny;i++){if(mask[i]&&zoneGrid[i]===z)bin[i]=1;}
    const pixRings=vectorizeZoneBoundary(bin,snx,sny);
    if(!pixRings.length)continue;
    
    const geoParts=[];
    for(const pRing of pixRings){
      const rawRing0=[];
      for(let i=0;i<pRing.length-1;i++){
        const px=pRing[i][0],py=pRing[i][1];
        const pk=px+','+py;
        
        if(smoothPtMap[pk]){
          rawRing0.push(smoothPtMap[pk]);
        } else {
          const geo=[xmin+px*sRES,ymin+py*sRES];
          rawRing0.push(geo);
        }
      }
      
      if(rawRing0.length<3)continue;
      
      // Clip to field boundary with proper handling of concavities/notches.
      // When the polygon crosses from inside to outside (or vice versa),
      // insert the actual boundary vertices along the crossing to follow
      // the boundary shape around farmstead cutouts and concave edges.
      // Densify before clipping. The clip works per vertex: an outside
      // vertex is pulled onto the nearest boundary point. Two vertices far
      // apart get pulled to two distant boundary points, and the straight
      // line between them cuts back across the neighbour's ground wherever
      // the field is concave. Short segments leave nowhere for that chord
      // to go.
      const rawRing=densifyRing(rawRing0,sRES*0.5);
      const clippedRing=[];
      const n=rawRing.length;
      for(let i=0;i<n;i++){
        const pt=rawRing[i];
        const ptIn=pip(pt[0],pt[1],fieldRing);
        const nextPt=rawRing[(i+1)%n];
        const nextIn=pip(nextPt[0],nextPt[1],fieldRing);
        
        if(ptIn){
          clippedRing.push(pt);
          // If next point is outside, we're exiting the field.
          // Find where we exit and insert boundary vertices until we re-enter.
          if(!nextIn){
            // Find the boundary segment nearest to this exit point
            let exitPt=projToBdy(pt,nextPt,fieldRing);
            if(exitPt)clippedRing.push(exitPt);
          }
        } else {
          // Point is outside. Project onto nearest boundary segment.
          let bestD=Infinity,bestPt=pt;
          for(let bi=0;bi<fieldRing.length-1;bi++){
            const a=fieldRing[bi],b=fieldRing[bi+1];
            const dx2=b[0]-a[0],dy2=b[1]-a[1],lenSq=dx2*dx2+dy2*dy2;
            if(lenSq<1e-20)continue;
            const t=Math.max(0,Math.min(1,((pt[0]-a[0])*dx2+(pt[1]-a[1])*dy2)/lenSq));
            const proj=[a[0]+t*dx2,a[1]+t*dy2];
            const d2=(pt[0]-proj[0])**2+(pt[1]-proj[1])**2;
            if(d2<bestD){bestD=d2;bestPt=proj;}
          }
          clippedRing.push(bestPt);
          
          // If next point is inside, we're re-entering the field.
          if(nextIn){
            let enterPt=projToBdy(nextPt,pt,fieldRing);
            if(enterPt)clippedRing.push(enterPt);
          }
        }
      }

      
      if(clippedRing.length<3)continue;
      
      // Post-process: detect where consecutive vertices create an edge
      // that crosses through a concave notch (farmstead cutout).
      // Insert boundary vertices to go AROUND the notch.
      const fixedRing=[];
      for(let i=0;i<clippedRing.length;i++){
        fixedRing.push(clippedRing[i]);
        const next=clippedRing[(i+1)%clippedRing.length];
        // Check if the edge from this vertex to next crosses the boundary
        const crossings=findAllBdyCrossings(clippedRing[i],next,fieldRing);
        if(crossings.length>=2){
          // Edge crosses boundary twice = passes through a notch
          // Insert boundary vertices between the two crossing points
          // Sort crossings by parameter t along the edge
          crossings.sort((a,b)=>a.t-b.t);
          // Find the boundary vertex range between the two crossing segments
          const seg1=crossings[0].seg;
          const seg2=crossings[crossings.length-1].seg;
          // Insert the crossing point, boundary vertices around notch, exit crossing
          fixedRing.push(crossings[0].pt);
          // Walk boundary from seg1 to seg2 (choosing the shorter path through the notch)
          const nBdy=fieldRing.length-1;
          const fwd=seg2>seg1?seg2-seg1:nBdy-seg1+seg2;
          const bwd=seg1>seg2?seg1-seg2:nBdy-seg2+seg1;
          if(fwd<=bwd){
            for(let s=seg1+1;s!==seg2+1;s=(s+1)%nBdy){
              fixedRing.push([fieldRing[s][0],fieldRing[s][1]]);
            }
          }else{
            for(let s=seg1;s!==seg2;s=(s-1+nBdy)%nBdy){
              fixedRing.push([fieldRing[s][0],fieldRing[s][1]]);
            }
          }
          fixedRing.push(crossings[crossings.length-1].pt);
        }
      }
      
      const finalRing=fixedRing.length>=3?fixedRing:clippedRing;
      
      // Thorough cleanup of degenerate geometry artifacts.
      // Run multiple passes until stable.
      let cleanRing=finalRing.slice();
      for(let pass=0;pass<5;pass++){
        const prev=cleanRing.length;
        cleanRing=cleanupRing(cleanRing,fieldRing);
        if(cleanRing.length===prev)break; // stable
      }
      
      if(cleanRing.length<3)continue;
      cleanRing.push([cleanRing[0][0],cleanRing[0][1]]);
      geoParts.push(cleanRing);
    }
    
    if(!geoParts.length)continue;
    const zLo=rMin+rRange*(z-1)/NZONES;
    const zHi=rMin+rRange*z/NZONES;
    // The rate this zone is written at is the mean of the rates actually
    // computed inside it, not the middle of its band. The bands are equal
    // slices of [min,max], but the recommendation is not spread evenly
    // through them: P and K return exactly 0 at or above target, so most
    // fields are a large block of zeros and a few high spots. The band
    // midpoint put fertiliser on ground the model had said needed none -
    // 404 field-and-nutrient combinations, and on one field 146 acres of
    // MAP where 90% of the samples asked for nothing.
    const rate=Math.round((zLo+zHi)/2);   // replaced per zone in exportZones
    records.push({
      parts:geoParts,id:z,rate:rate,rate_lo:Math.round(zLo),rate_hi:Math.round(zHi),
      product:product,crop:crop,yield_gl:yg,unit:unit,product_1:rate,
    });
  }
  return records;
}

// Clean polygon ring for shapefile export.
// ALL boundary vertices are protected. Only interior spikes get removed.
function cleanupRing(ring,fieldRing){
  if(ring.length<4)return ring;
  function onBdy(pt){
    if(!fieldRing)return false;
    for(let i=0;i<fieldRing.length-1;i++){
      const a=fieldRing[i],b=fieldRing[i+1],dx=b[0]-a[0],dy=b[1]-a[1],ls=dx*dx+dy*dy;
      if(ls<1e-20)continue;
      const t=Math.max(0,Math.min(1,((pt[0]-a[0])*dx+(pt[1]-a[1])*dy)/ls));
      if((pt[0]-(a[0]+t*dx))**2+(pt[1]-(a[1]+t*dy))**2<1e-14)return true;
    }
    return false;
  }
  // Remove near-duplicates
  let r=[ring[0]];
  for(let i=1;i<ring.length;i++){
    const dx=ring[i][0]-r[r.length-1][0],dy=ring[i][1]-r[r.length-1][1];
    if(dx*dx+dy*dy<0.000008*0.000008)continue;
    r.push(ring[i]);
  }
  if(r.length>1){const dx=r[r.length-1][0]-r[0][0],dy=r[r.length-1][1]-r[0][1];if(dx*dx+dy*dy<0.000008*0.000008)r.pop();}
  if(r.length<4)return r;
  // Remove interior spikes (boundary vertices untouchable)
  let changed=true,iter=0;
  while(changed&&r.length>=4&&iter<200){
    changed=false;iter++;let worstI=-1,worstA=-1;
    for(let i=0;i<r.length;i++){
      if(onBdy(r[i]))continue;
      const p0=r[(i-1+r.length)%r.length],p1=r[i],p2=r[(i+1)%r.length];
      const dx1=p1[0]-p0[0],dy1=p1[1]-p0[1],dx2=p2[0]-p1[0],dy2=p2[1]-p1[1];
      const l1=Math.sqrt(dx1*dx1+dy1*dy1),l2=Math.sqrt(dx2*dx2+dy2*dy2);
      if(l1<1e-12||l2<1e-12){worstI=i;worstA=999;break;}
      const dot=(dx1*dx2+dy1*dy2)/(l1*l2);
      const ang=Math.acos(Math.max(-1,Math.min(1,dot)))*180/Math.PI;
      const ms=Math.min(l1,l2)*364000;
      if((ang>90)||(ang>45&&ms<40)){if(ang>worstA){worstA=ang;worstI=i;}}
    }
    if(worstI>=0){r.splice(worstI,1);changed=true;}
  }
  return r;
}
// Find all points where a line segment crosses the field boundary
function findAllBdyCrossings(p1,p2,bdy){
  const crossings=[];
  const dx1=p2[0]-p1[0],dy1=p2[1]-p1[1];
  for(let i=0;i<bdy.length-1;i++){
    const a=bdy[i],b=bdy[i+1];
    const dx2=b[0]-a[0],dy2=b[1]-a[1];
    const det=dx1*dy2-dy1*dx2;
    if(Math.abs(det)<1e-15)continue;
    const t=((a[0]-p1[0])*dy2-(a[1]-p1[1])*dx2)/det;
    const u=((a[0]-p1[0])*dy1-(a[1]-p1[1])*dx1)/det;
    if(t>0.001&&t<0.999&&u>=0&&u<=1){
      crossings.push({t:t,seg:i,pt:[p1[0]+t*dx1,p1[1]+t*dy1]});
    }
  }
  return crossings;
}

// Find where a line from inside pt to outside pt crosses the field boundary
function projToBdy(insidePt,outsidePt,bdy){
  let bestT=Infinity,bestPt=null;
  for(let i=0;i<bdy.length-1;i++){
    const a=bdy[i],b=bdy[i+1];
    // Line-segment intersection between (insidePt->outsidePt) and (a->b)
    const dx1=outsidePt[0]-insidePt[0],dy1=outsidePt[1]-insidePt[1];
    const dx2=b[0]-a[0],dy2=b[1]-a[1];
    const det=dx1*dy2-dy1*dx2;
    if(Math.abs(det)<1e-15)continue;
    const t=((a[0]-insidePt[0])*dy2-(a[1]-insidePt[1])*dx2)/det;
    const u=((a[0]-insidePt[0])*dy1-(a[1]-insidePt[1])*dx1)/det;
    if(t>=0&&t<=1&&u>=0&&u<=1&&t<bestT){
      bestT=t;bestPt=[insidePt[0]+t*dx1,insidePt[1]+t*dy1];
    }
  }
  return bestPt;
}

// Insert actual boundary vertices from index i1 to i2 (shorter arc)
function insertBdyArc(out,i1,i2,bdy){
  const n=bdy.length-1; // closed ring, last=first
  if(n<=0||i1===i2)return;
  const fwd=i2>i1?i2-i1:n-i1+i2;
  const bwd=i1>i2?i1-i2:n-i2+i1;
  if(fwd<=bwd){
    let ci=i1;
    for(let s=0;s<fwd&&s<n;s++){ci=(ci+1)%n;out.push([bdy[ci][0],bdy[ci][1]]);}
  }else{
    let ci=i1;
    for(let s=0;s<bwd&&s<n;s++){ci=(ci-1+n)%n;out.push([bdy[ci][0],bdy[ci][1]]);}
  }
}

// Douglas-Peucker line simplification
function douglasPeucker(pts,tol){
  if(pts.length<=2)return pts;
  let maxD=0,maxI=0;
  const a=pts[0],b=pts[pts.length-1];
  const dx=b[0]-a[0],dy=b[1]-a[1],lenSq=dx*dx+dy*dy;
  for(let i=1;i<pts.length-1;i++){
    let d;
    if(lenSq<1e-20){d=Math.sqrt((pts[i][0]-a[0])**2+(pts[i][1]-a[1])**2);}
    else{const t=Math.max(0,Math.min(1,((pts[i][0]-a[0])*dx+(pts[i][1]-a[1])*dy)/lenSq));
      d=Math.sqrt((pts[i][0]-(a[0]+t*dx))**2+(pts[i][1]-(a[1]+t*dy))**2);}
    if(d>maxD){maxD=d;maxI=i;}
  }
  if(maxD>tol){
    const left=douglasPeucker(pts.slice(0,maxI+1),tol);
    const right=douglasPeucker(pts.slice(maxI),tol);
    return left.slice(0,-1).concat(right);
  }
  return[pts[0],pts[pts.length-1]];
}

// Densify a polygon ring so no segment is longer than maxLen
function densifyRing(ring,maxLen){
  const out=[];
  for(let i=0;i<ring.length-1;i++){
    const p0=ring[i],p1=ring[i+1];out.push(p0);
    const dx=p1[0]-p0[0],dy=p1[1]-p0[1],len=Math.sqrt(dx*dx+dy*dy);
    if(len>maxLen){const n=Math.ceil(len/maxLen);
      for(let j=1;j<n;j++)out.push([p0[0]+dx*j/n,p0[1]+dy*j/n]);}
  }
  out.push(ring[ring.length-1]);
  return out;
}

// Build a shapefile with multi-part polygons (matching GeoPard format)
function buildMultiPartSHP(records,flds){
  // Calculate exact SHP content size
  let contentLen=0;
  records.forEach(r=>{
    const numParts=r.parts.length;
    const numPoints=r.parts.reduce((s,p)=>s+p.length,0);
    contentLen+=8+4+32+4+4+numParts*4+numPoints*16;
  });
  
  // Add safety margin
  const shpBuf=new ArrayBuffer(100+contentLen+1024);
  const shpDV=new DataView(shpBuf);
  const shxBuf=new ArrayBuffer(100+records.length*8);
  const shxDV=new DataView(shxBuf);
  
  // Global bbox
  let gxn=Infinity,gyn=Infinity,gxx=-Infinity,gyx=-Infinity;
  records.forEach(r=>r.parts.forEach(p=>p.forEach(([x,y])=>{gxn=Math.min(gxn,x);gyn=Math.min(gyn,y);gxx=Math.max(gxx,x);gyx=Math.max(gyx,y);})));
  
  // SHP header
  shpDV.setInt32(0,9994,false);
  shpDV.setInt32(24,(100+contentLen)/2,false);
  shpDV.setInt32(28,1000,true);shpDV.setInt32(32,5,true); // Polygon type
  shpDV.setFloat64(36,gxn,true);shpDV.setFloat64(44,gyn,true);
  shpDV.setFloat64(52,gxx,true);shpDV.setFloat64(60,gyx,true);
  
  // SHX header
  shxDV.setInt32(0,9994,false);
  shxDV.setInt32(24,(100+records.length*8)/2,false);
  shxDV.setInt32(28,1000,true);shxDV.setInt32(32,5,true);
  shxDV.setFloat64(36,gxn,true);shxDV.setFloat64(44,gyn,true);
  shxDV.setFloat64(52,gxx,true);shxDV.setFloat64(60,gyx,true);
  
  let shpOff=100;
  let shxWordOff=50; // in 16-bit words
  
  records.forEach((rec,recIdx)=>{
    const numParts=rec.parts.length;
    const numPoints=rec.parts.reduce((s,p)=>s+p.length,0);
    const recContentBytes=4+32+4+4+numParts*4+numPoints*16;
    
    // SHX entry
    shxDV.setInt32(100+recIdx*8,shxWordOff,false);
    shxDV.setInt32(100+recIdx*8+4,recContentBytes/2,false);
    shxWordOff+=4+recContentBytes/2; // 8 bytes header = 4 words + content
    
    // Record header
    shpDV.setInt32(shpOff,recIdx+1,false); // record number
    shpDV.setInt32(shpOff+4,recContentBytes/2,false);
    shpOff+=8;
    
    // Shape type
    shpDV.setInt32(shpOff,5,true); // Polygon
    shpOff+=4;
    
    // Record bbox
    let rxn=Infinity,ryn=Infinity,rxx=-Infinity,ryx=-Infinity;
    rec.parts.forEach(p=>p.forEach(([x,y])=>{rxn=Math.min(rxn,x);ryn=Math.min(ryn,y);rxx=Math.max(rxx,x);ryx=Math.max(ryx,y);}));
    shpDV.setFloat64(shpOff,rxn,true);shpDV.setFloat64(shpOff+8,ryn,true);
    shpDV.setFloat64(shpOff+16,rxx,true);shpDV.setFloat64(shpOff+24,ryx,true);
    shpOff+=32;
    
    // Num parts and num points
    shpDV.setInt32(shpOff,numParts,true);shpOff+=4;
    shpDV.setInt32(shpOff,numPoints,true);shpOff+=4;
    
    // Parts index array
    let ptIdx=0;
    rec.parts.forEach((p,pi)=>{
      shpDV.setInt32(shpOff,ptIdx,true);shpOff+=4;
      ptIdx+=p.length;
    });
    
    // Points
    rec.parts.forEach(p=>{
      p.forEach(([x,y])=>{
        shpDV.setFloat64(shpOff,x,true);
        shpDV.setFloat64(shpOff+8,y,true);
        shpOff+=16;
      });
    });
  });
  
  // DBF
  const dbfData=bDBF(flds,records);
  
  return{
    shp:new Uint8Array(shpBuf,0,shpOff),
    shx:new Uint8Array(shxBuf),
    dbf:dbfData,
    prj:'GEOGCS["GCS_WGS_1984",DATUM["D_WGS_1984",SPHEROID["WGS_1984",6378137.0,298.257223563]],PRIMEM["Greenwich",0.0],UNIT["Degree",0.0174532925199433]]'
  };
}
function exportCSV(){
  if(!sel)return;const fp=FP[sel];if(!fp||!fp.sets.length)return;
  const pts=activeSet(sel).pts;
  // Every rate here goes through the same zonal function the map and the
  // shapefile use, so the three agree. Calling calcPRate(pt.p, rxYG, ...)
  // directly skipped the yield scaling, so the CSV and the shapefile gave
  // different numbers for the same point. A blank means "no reading"; a
  // computed rate of 0 is written as 0.
  const rf=n=>makeZonalRateFn(sel,n,rxCrop,rxYG,rxTargetP,rxTargetK,rxTargetPH,rxTargetS,rxTargetZn,rxPC);
  const fP=rf('p'),fK=rf('k'),fPH=rf('ph'),fS=rf('s'),fZN=rf('zn'),fN=rf('n');
  const v=x=>x==null?'':x;
  let csv='ID,LAT,LON,SOIL_P,SOIL_K,SOIL_PH,SOIL_OM,SOIL_S,SOIL_ZN,SOIL_CEC,SOIL_BPH,RX_P2O5,RX_K2O,RX_LIME,RX_N,RX_S,RX_ZN,CROP,YIELD_GOAL\n';
  pts.forEach(pt=>{csv+=`${pt.id},${pt.y},${pt.x},${v(pt.p)},${v(pt.k)},${v(pt.ph)},${v(pt.om)},${v(pt.s)},${v(pt.zn)},${v(pt.cec)},${v(pt.bph)},${v(fP(pt))},${v(fK(pt))},${v(fPH(pt))},${v(fN(pt))},${v(fS(pt))},${v(fZN(pt))},${rxCrop},${rxYG}\n`;});
  const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`VR_${sel}_${rxCrop}.csv`;document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function bSHP(pp){let cl=0;pp.forEach(p=>{cl+=8+4+32+4+4+4+p.length*16;});const buf=new ArrayBuffer(100+cl);const dv=new DataView(buf);
  let xn=Infinity,yn=Infinity,xx=-Infinity,yx=-Infinity;pp.forEach(p=>p.forEach(([x,y])=>{xn=Math.min(xn,x);yn=Math.min(yn,y);xx=Math.max(xx,x);yx=Math.max(yx,y);}));
  dv.setInt32(0,9994,false);dv.setInt32(24,(100+cl)/2,false);dv.setInt32(28,1000,true);dv.setInt32(32,5,true);
  dv.setFloat64(36,xn,true);dv.setFloat64(44,yn,true);dv.setFloat64(52,xx,true);dv.setFloat64(60,yx,true);
  let o=100;pp.forEach((p,i)=>{const np=p.length,c2=4+32+4+4+4+np*16;dv.setInt32(o,i+1,false);dv.setInt32(o+4,c2/2,false);o+=8;dv.setInt32(o,5,true);o+=4;
    let rxn=Infinity,ryn=Infinity,rxx=-Infinity,ryx=-Infinity;p.forEach(([x,y])=>{rxn=Math.min(rxn,x);ryn=Math.min(ryn,y);rxx=Math.max(rxx,x);ryx=Math.max(ryx,y);});
    dv.setFloat64(o,rxn,true);dv.setFloat64(o+8,ryn,true);dv.setFloat64(o+16,rxx,true);dv.setFloat64(o+24,ryx,true);o+=32;
    dv.setInt32(o,1,true);o+=4;dv.setInt32(o,np,true);o+=4;dv.setInt32(o,0,true);o+=4;
    p.forEach(([x,y])=>{dv.setFloat64(o,x,true);dv.setFloat64(o+8,y,true);o+=16;});});return new Uint8Array(buf,0,o);}
function bSHX(pp){const n=pp.length;const buf=new ArrayBuffer(100+n*8);const dv=new DataView(buf);
  let xn=Infinity,yn=Infinity,xx=-Infinity,yx=-Infinity;pp.forEach(p=>p.forEach(([x,y])=>{xn=Math.min(xn,x);yn=Math.min(yn,y);xx=Math.max(xx,x);yx=Math.max(yx,y);}));
  dv.setInt32(0,9994,false);dv.setInt32(24,(100+n*8)/2,false);dv.setInt32(28,1000,true);dv.setInt32(32,5,true);
  dv.setFloat64(36,xn,true);dv.setFloat64(44,yn,true);dv.setFloat64(52,xx,true);dv.setFloat64(60,yx,true);
  let off=50;pp.forEach((p,i)=>{const c2=(4+32+4+4+4+p.length*16)/2;dv.setInt32(100+i*8,off,false);dv.setInt32(100+i*8+4,c2,false);off+=4+c2;});return new Uint8Array(buf);}
function bDBF(fields,recs){const nR=recs.length,nF=fields.length;const hSz=32+nF*32+1;const rSz=1+fields.reduce((s,f)=>s+f.l,0);
  const buf=new ArrayBuffer(hSz+nR*rSz+1);   // +1 for the end-of-file marker
  const dv=new DataView(buf);const b=new Uint8Array(buf);
  dv.setUint8(0,3);const now=new Date();dv.setUint8(1,now.getFullYear()-1900);dv.setUint8(2,now.getMonth()+1);dv.setUint8(3,now.getDate());
  dv.setInt32(4,nR,true);dv.setInt16(8,hSz,true);dv.setInt16(10,rSz,true);
  let fo=32;fields.forEach(f=>{for(let i=0;i<Math.min(f.n.length,11);i++)b[fo+i]=f.n.charCodeAt(i);b[fo+11]=f.t.charCodeAt(0);b[fo+16]=f.l;b[fo+17]=f.d;fo+=32;});b[fo]=0x0D;
  let ro=hSz;recs.forEach(rec=>{b[ro]=0x20;ro++;
    fields.forEach(f=>{let v='';const k=f.n.toLowerCase();const rv=rec[k];
      if(rv==null)v='';else if(f.t==='N')v=f.d>0?Number(rv).toFixed(f.d):String(Math.round(rv));else v=String(rv);
      // dBASE wants character fields left-justified and numbers right-
      // justified, and an overlong value must lose its tail, not its head.
      v=v.length>f.l?v.slice(0,f.l):(f.t==='C'?v.padEnd(f.l,' '):v.padStart(f.l,' '));
      for(let i=0;i<f.l;i++)b[ro+i]=v.charCodeAt(i)||0x20;ro+=f.l;});});
  b[ro++]=0x1A;   // dBASE end-of-file marker, which older readers expect
  return new Uint8Array(buf,0,ro);}
function dlZip(shp,name){const files=[{name:name+'.shp',data:shp.shp},{name:name+'.shx',data:shp.shx},{name:name+'.dbf',data:shp.dbf},{name:name+'.prj',data:new TextEncoder().encode(shp.prj)}];
  const zip=mkZip(files);const blob=new Blob([zip],{type:'application/zip'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name+'.zip';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);}
function mkZip(files){const cd=[],lf=[];let off=0;
  files.forEach(f=>{const nm=new TextEncoder().encode(f.name);const crc=crc32(f.data);
    const l=new ArrayBuffer(30+nm.length+f.data.length);const ldv=new DataView(l);const lb=new Uint8Array(l);
    ldv.setUint32(0,0x04034b50,true);ldv.setUint16(4,20,true);ldv.setUint32(14,crc,true);ldv.setUint32(18,f.data.length,true);ldv.setUint32(22,f.data.length,true);ldv.setUint16(26,nm.length,true);lb.set(nm,30);lb.set(f.data,30+nm.length);
    const c=new ArrayBuffer(46+nm.length);const cdv=new DataView(c);const cb=new Uint8Array(c);
    cdv.setUint32(0,0x02014b50,true);cdv.setUint16(4,20,true);cdv.setUint16(6,20,true);cdv.setUint32(16,crc,true);cdv.setUint32(20,f.data.length,true);cdv.setUint32(24,f.data.length,true);cdv.setUint16(28,nm.length,true);cdv.setUint32(42,off,true);cb.set(nm,46);
    lf.push(new Uint8Array(l));cd.push(new Uint8Array(c));off+=l.byteLength;});
  const cdOff=off;let cdSz=0;cd.forEach(c=>cdSz+=c.length);
  const eocd=new ArrayBuffer(22);const edv=new DataView(eocd);edv.setUint32(0,0x06054b50,true);edv.setUint16(8,files.length,true);edv.setUint16(10,files.length,true);edv.setUint32(12,cdSz,true);edv.setUint32(16,cdOff,true);
  const r=new Uint8Array(off+cdSz+22);let p=0;lf.forEach(l=>{r.set(l,p);p+=l.length;});cd.forEach(c=>{r.set(c,p);p+=c.length;});r.set(new Uint8Array(eocd),p);return r;}
function crc32(d){let c=0xFFFFFFFF;const t=new Uint32Array(256);for(let i=0;i<256;i++){let v=i;for(let j=0;j<8;j++)v=v&1?0xEDB88320^(v>>>1):v>>>1;t[i]=v;}for(let i=0;i<d.length;i++)c=t[(c^d[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}

// Batch export
// Read whatever is on screen back into state. The dialog is rebuilt from
// scratch when the nutrient changes, so anything the user had already
// chosen has to be captured first - it used to be silently reset to
// automatic, and the whole farm was then written on each field's own
// rotation and history instead of what was asked for.
function readBatchForm(){
  const c=document.getElementById('bCrop'),g=document.getElementById('bGoal'),
        y=document.getElementById('bYG'),pr=document.getElementById('bProd');
  if(pr)rxProd[rxNut]=+pr.value;
  if(c)batchCrop=c.value;
  if(g)batchGoal=(g.value==='auto')?'auto':(+((y&&y.value)||0)||'auto');
}
function batchNut(v){readBatchForm();rxNut=v;openBatchExport();}
function closeBatch(){readBatchForm();showModal=null;render();}
function openBatchExport(){
  const nS=Object.keys(FP).filter(f=>BNDRY[f]).length;
  const nutLabel={p:'P₂O₅',k:'K₂O',ph:'Lime',s:'Sulfur',zn:'Zinc'};
  showModal=`<div class="modal-ov" onclick="if(event.target===this){closeBatch();}"><div class="modal"><h2>📦 Batch VR Export<button class="mcl" onclick="closeBatch()">✕</button></h2>
    <div class="dn"><b>One download for all ${nS} soil-sampled fields.</b> Inside: a shapefile zip per field for Operations Center (RATE in lb of product) and an order summary CSV with acres, average rate and tons per field. Takes a minute or two; the page will sit still while it works.</div>
    <div class="rxb" style="margin-bottom:12px">
      <div class="rxr"><label>Nutrient</label><select onchange="batchNut(this.value)">${['p','k','ph','s','zn'].map(n=>`<option value="${n}" ${rxNut===n?'selected':''}>${nutLabel[n]}</option>`).join('')}</select>
        <select id="bProd">${PRODUCTS[rxNut].map((p,i)=>`<option value="${i}" ${(rxProd[rxNut]||0)===i?'selected':''}>${p.name} (${Math.round(p.pct*100)}%)</option>`).join('')}</select></div>
      <div class="rxr"><label>Crop ${META.plan_year}</label><select id="bCrop"><option value="auto" ${batchCrop==='auto'?'selected':''}>Each field's rotation (flip of ${META.plan_year-1})</option><option value="corn" ${batchCrop==='corn'?'selected':''}>All corn</option><option value="soybean" ${batchCrop==='soybean'?'selected':''}>All soybean</option></select></div>
      <div class="rxr"><label>Yield goal</label><select id="bGoal"><option value="auto" ${batchGoal==='auto'?'selected':''}>Each field's own history +5%</option><option value="fixed" ${batchGoal!=='auto'?'selected':''}>Fixed, bu/ac:</option></select><input id="bYG" type="number" value="${batchGoal==='auto'?rxYG:batchGoal}" style="max-width:70px;flex:none"/></div>
      <div class="rxr"><label>Targets</label><span style="font-size:10px;color:var(--tx2)">P ${rxTargetP} · K ${rxTargetK} · pH ${rxTargetPH.toFixed(1)} · S ${rxTargetS} · Zn ${rxTargetZn.toFixed(1)} ppm (set on a field's VR Rx tab)</span></div>
    </div>
    <div class="br"><button class="btn" onclick="runBatch()">⬇ Export All Fields</button><button class="btn btn-o" onclick="closeBatch()">Cancel</button></div></div></div>`;
  render();}
function runBatch(){
  readBatchForm();
  const prod=productFor(rxNut),nutName=NUTRIENT_NAME[rxNut];
  const files=[],rows=[['field','org','farm','county','acres','crop','prev_crop','yield_goal','nutrient','avg_nutrient_lb_ac','product','analysis_pct','avg_product_lb_ac','product_lb','product_tons','zones','soil_test','sampled']];
  const names=Object.keys(FP).filter(f=>BNDRY[f]).sort();
  let done=0,skipped=0;
  names.forEach(f=>{
    const crop=batchCrop==='auto'?planCrop(f):batchCrop;
    const pc=prevCrop(f);
    const yg=batchGoal==='auto'?defaultGoal(f,crop):batchGoal;
    const rateFn=makeZonalRateFn(f,rxNut,crop,yg,rxTargetP,rxTargetK,rxTargetPH,rxTargetS,rxTargetZn,pc);
    let z=null;try{z=exportZones(f,rateFn,rxNut,crop,yg);}catch(e){console.warn(f,e);}
    if(!z||!z.records.length){skipped++;return;}
    const shp=buildMultiPartSHP(z.records,RX_FIELDS);
    const nm=rxFileName(f,rxNut,crop);
    files.push({name:nm+'.zip',data:mkZip([{name:nm+'.shp',data:shp.shp},{name:nm+'.shx',data:shp.shx},{name:nm+'.dbf',data:shp.dbf},{name:nm+'.prj',data:new TextEncoder().encode(shp.prj)}])});
    const ac=z.records.reduce((s,r)=>s+r.acres,0);
    const lbProd=z.records.reduce((s,r)=>s+r.rate*r.acres,0),lbNut=z.records.reduce((s,r)=>s+r.nut_rate*r.acres,0);
    const p=FPROP[f]||{};
    const set=activeSet(f);
    rows.push([f,p.org||'',p.farm||'',(FI[f]&&FI[f].county)||'',ac.toFixed(1),crop,pc,yg,nutName,ac?(lbNut/ac).toFixed(0):'',prod.name,Math.round(prod.pct*100),ac?(lbProd/ac).toFixed(0):'',lbProd.toFixed(0),(lbProd/2000).toFixed(2),z.records.length,
      set?(set.kind==='whole'?'whole-field composite':set.kind==='scaled'?`${set.d} level on the ${String(set.from_grid).slice(0,4)} grid`:`grid, ${set.pts.length} pts`):'',set?set.d:'']);
    done++;
  });
  const csv=rows.map(r=>r.map(v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(',')).join('\n');
  files.push({name:`order_summary_${nutName}_${META.plan_year}.csv`,data:new TextEncoder().encode(csv)});
  const blob=new Blob([mkZip(files)],{type:'application/zip'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`VR_Rx_batch_${nutName}_${META.plan_year}.zip`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  showModal=null;render();
  alert(`Exported ${done} fields${skipped?`, skipped ${skipped} with no zones`:''}. One shapefile zip per field plus order_summary_${nutName}_${META.plan_year}.csv.`);
}

// Events
function tF(f){if(expanded.has(f))expanded.delete(f);else expanded.add(f);uSB();}
function sF(f){sel=f;panelTab=FP[f]?'zones':'history';clearOv();leaveVR();
  {const ns=document.getElementById('nsel');if(ns)ns.innerHTML=rNS();}

function rNS(){
  return `<select onchange="sHN(this.value)">${sel&&FP[sel]?`<option value="vr" ${hNut==='vr'?'selected':''}>VR Rx rate zones</option>`:''}<option value="fert" ${hNut==='fert'?'selected':''}>Overall fertility</option><option value="yield" ${hNut==='yield'?'selected':''}>Yield map (all years)</option><option value="gap" ${hNut==='gap'?'selected':''}>How far off (rating vs fertility)</option><option value="csr" ${hNut==='csr'?'selected':''}>CSR2 (Iowa soil rating)</option><option value="nccpi" ${hNut==='nccpi'?'selected':''}>NCCPI (soil productivity)</option>${['p','k','ph','om','cec','s','zn','ca','mg','bph','p2','mn'].map(k=>`<option value="${k}" ${hNut===k?'selected':''}>${TH[k]?.nm||k}</option>`).join('')}</select>${hNut==='nccpi'?`<select style="margin-left:6px;min-width:0" onchange="svCrop=this.value;sHN('nccpi')">${[['all','All crops'],['corn','Corn'],['soy','Soybean']].map(([v,l])=>`<option value="${v}" ${svCrop===v?'selected':''}>${l}</option>`).join('')}</select>`:''}`;}
function sHN(n){if(n!=='vr')prevNut=n;hNut=n;ptShowAll=false;const ns=document.getElementById('nsel');if(ns)ns.innerHTML=rNS();rFertChips();rfM();updateLegend();
  if(!sel)return;
  rP();showInterp();}
// The menu's "VR Rx rate zones" only makes sense with the VR panel open;
// leaving that tab puts the menu back where it was.
function leaveVR(){if(hNut==='vr'){hNut=prevNut;const ns=document.getElementById('nsel');if(ns)ns.innerHTML=rNS();rFertChips();}}
// Only the list is redrawn. Replacing the whole sidebar took the input the
// user was typing in with it, so focus was lost after every character; and
// the value was interpolated raw, so a quote in the search text broke out
// of the attribute and could plant an event handler.
function uSB(){
  const box=document.querySelector('.sb');if(!box)return;
  const inp=box.querySelector('.sb-input');
  const list=box.querySelector('.fl');
  if(inp&&list){if(inp.value!==sq)inp.value=sq;list.innerHTML=rFL();return;}
  box.innerHTML=`<input class="sb-input" placeholder="Search fields..." value="${attr(sq)}" oninput="uSrch(this.value)"/><h3>Farm Fields</h3><div class="fl">${rFL()}</div>`;
}

render();
