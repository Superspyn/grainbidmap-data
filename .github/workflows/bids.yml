name: Update cash bids

# MANUAL FALLBACK ONLY - no schedule. All routine scraping runs on the farm PC
# via scripts/update-bids.ps1 (weekdays :15/:45, 8:15am-5:45pm Central).
#
# The schedule was removed deliberately, for two reasons observed in practice:
#   - NEW Co-op (403) and Landus (429) block GitHub's datacenter IP ranges, so
#     a cloud run can never refresh 116 of the pins. Both answer normally from
#     the farm's home connection.
#   - GitHub's cron was unreliable anyway: 1 of 10 scheduled slots actually
#     fired, and that one ran 2.5 hours late. The farm PC task went 8 for 8.
#
# Keep this workflow: if the farm PC is off for days, trigger it by hand from
# the Actions tab and it refreshes the 19 sources it can reach, marking NEW
# Co-op and Landus stale (with their last good bids) rather than blanking them.
on:
  workflow_dispatch:

# Never let two runs fight over the same commit.
concurrency:
  group: bids
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Run tests
        # Offline, fixture-based. If a parser is broken, fail before publishing.
        run: python -m pytest scrapers/tests -q

      - name: Scrape bids
        env:
          # Identifies us politely to the co-op sites we fetch from.
          BIDS_CONTACT: https://github.com/${{ github.repository }}
        run: python scrapers/build_bids.py

      - name: Validate output
        run: python scrapers/build_bids.py --validate docs/bids.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/bids.json; then
            echo "No bid changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bids.json
          git commit -m "Update cash bids ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          # A push from the farm PC can land between our checkout and our push.
          # bids.json is generated, not authored, so there is nothing to merge:
          # the newer build already carries everything the older one did. On a
          # rejection, keep whichever file has the later generated_at.
          cp docs/bids.json "$RUNNER_TEMP/ours.json"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) - comparing against origin/main"
            git fetch origin main
            git reset --hard origin/main

            if python -c 'import json, sys; f = lambda p: json.load(open(p, encoding="utf-8"))["generated_at"]; sys.exit(0 if f(sys.argv[1]) > f(sys.argv[2]) else 1)' "$RUNNER_TEMP/ours.json" docs/bids.json; then
              echo "our build is newer - re-committing on top"
              cp "$RUNNER_TEMP/ours.json" docs/bids.json
              git add docs/bids.json
              git commit -m "Update cash bids ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            else
              echo "origin already has a newer build - nothing to do"
              exit 0
            fi
          done
          echo "could not push after 3 attempts"
          exit 1
