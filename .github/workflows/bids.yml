name: Update cash bids

# Every 30 minutes through the trading day, weekdays only.
#
# GitHub cron is UTC and does not follow daylight saving, so the window is set
# wide enough to cover the working day in both halves of the year:
#   13:00-22:30 UTC = 8:00am-5:30pm CDT (summer) / 7:00am-4:30pm CST (winter)
#
# That is 20 runs a day. Each run is 16 HTTP requests - one per co-op, not one
# per elevator - so it stays light on the sites we pull from. Runs that find no
# change do not commit.
on:
  schedule:
    - cron: '0,30 13-22 * * 1-5'
  workflow_dispatch:

# Never let two runs fight over the same commit.
concurrency:
  group: bids
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Run tests
        # Offline, fixture-based. If a parser is broken, fail before publishing.
        run: python -m pytest scrapers/tests -q

      - name: Scrape bids
        env:
          # Identifies us politely to the co-op sites we fetch from.
          BIDS_CONTACT: https://github.com/${{ github.repository }}
        run: python scrapers/build_bids.py

      - name: Validate output
        run: python scrapers/build_bids.py --validate docs/bids.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/bids.json; then
            echo "No bid changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bids.json
          git commit -m "Update cash bids ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
